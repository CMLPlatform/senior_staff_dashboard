ience/b/jan_boersema_200_250.jpg/jan_boersema_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/jan-boersema", "field": "environmental_biology", "classification_basis": "keywords (no department listed): IE=13, EB=36", "rank": "Professor", "harmonized_tags": ["Policy, economics & governance", "Ecosystem services & nature-based solutions"], "original_keywords": ["environmental philosophy", "sustainability and religion"], "raw_keywords": ["curriculum", "environmental philosophy", "environmental sciences", "principles of environmental sciences", "sustainability and religion"], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 1.9, "Resources": 0.4, "Urban": 0.2}}, {"name": "Thijs Bosker", "title": "Associate professor", "keywords": ["ecotoxicology", "emerging contaminants", "microplastics", "multiple stressors", "plastic pollution"], "tags": ["Associate professor", "ecotoxicology", "emerging contaminants", "microplastics", "multiple stressors", "plastic pollution"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Thijs Bosker is an Associate Professor in Environmental Science. He uses laboratory and field techniques to study the impacts of contaminants on ecosystem health, with a focus on stress-on-stress scenarios. His research has taken him to Canada, the US, New Zealand, and the Netherlands, where he quantifies the combined effects of contaminants (e.g., microplastics, pharmaceuticals, oil residues) and environmental stressors (e.g., low oxygen, high temperature) on organisms ranging from plants and invertebrates to fish. He assesses impacts from physiological changes to population and community-level effects and uses this information to predict environmental risks. In his research, he uses laboratory and field techniques to study the impacts of contaminants on ecosystem health, with a focus on stress-on-stress scenarios. His research has taken him to Canada, the US, New Zealand, and the Netherlands. He quantifies the combined impacts of contaminants (e.g. microplastics, pharmaceuticals in wastewater, or oil residues) and environmental stressors (e.g. low oxygen or high temperature) on a range of organisms (including plants, invertebrates, and fish). He assesses impacts at different levels of biological organization, ranging from physiological changes to population and community-level impacts, and he uses this data to predict the risk of contaminants on the environment. In addition, Thijs is passionate about teaching and outreach. He has developed 15 courses, from field schools in Africa and the Netherlands to marine biology and environmental science courses. He also regularly gives lectures to the general public, gives workshops to children, and appears in the media (newspapers, television, and radio). He has developed a website with teaching materials for university lecturers from different fields (e.g., communication studies, psychology, and international law) on sustainability challenges (www.local-actions.com). Currently, he is the program director of the interdisciplinary bachelor Science for Sustainable Societies. This interdisciplinary BSc program combines knowledge from both the natural (e.g., ecology and earth system sciences) and social sciences (e.g., anthropology, public administration, and psychology) to better understand complex environmental issues and identify pathways forward. Thijs received his MSc from Wageningen University (the Netherlands), and his PhD from the University of New Brunswick (Canada). Before joining the Institute of Environmental Sciences at Leiden University he worked as an Associate Professor at Leiden University College, as an Assistant Professor at the University of Connecticut (USA), and as a postdoctoral fellow at the Canadian Rivers Institute. Thijs has developed and taught >15 different courses, and is currently teaching the following courses", "projects": [{"title": "Water and Society Lab", "url": "https://www.universiteitleiden.nl/en/research/research-projects/governance-and-global-affairs/water-and-society-lab"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/campus-the-hague/unsorted/thijs-bosker-2018-klein.jpg/thijs-bosker-2018-klein.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/thijs-bosker", "field": "environmental_biology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Ecotoxicology & chemical pollution"], "original_keywords": ["ecotoxicology", "emerging contaminants", "plastic pollution", "multiple stressors"], "raw_keywords": ["ecotoxicology", "emerging contaminants", "microplastics", "multiple stressors", "plastic pollution"], "cml_themes": ["Water", "Biodiversity"], "cml_scores": {"Biodiversity": 1.2, "Water": 1.4}}, {"name": "Jan Willem Erisman", "title": "Professor Environmental sustainability", "keywords": ["atmosphere- biosphere interaction", "ecosystem services", "environment", "liveable planet", "nitrogen", "sustainability"], "tags": ["Professor Environmental sustainability", "atmosphere- biosphere interaction", "ecosystem services", "environment", "liveable planet", "nitrogen", "sustainability"], "organisation": ["Science", "Institute of Environmental Sciences (CML)"], "summary": "Prof.dr.ing. Jan Willem Erisman is professor Enviromental Sustainability within the Institute of Environmental Sciences of Leiden University. He is member of the Health Council of the Netherlands (Gezondheidsraad) and a member of the Council of Animal Affairs (Raad voor Dierenaangelegenheden). Jan Willem obtained his PhD on Atmospheric deposition of acidifying compounds in the Netherlands in 1992 at the University of Utrecht in the Netherlands. In 2009 he was appointed as extraordinary professor on Integrated Nitrogen Studies at VU university Amsterdam. It is Jan Willem’s ambition to contribute to sustainable development of our society. He has done this through developing a career in science, management and commercialisation of technology, all ingredients necessary to fulfil this ambition. His work starts with a system view and he uses participatory approaches to work towards practical solutions for pressing societal issues such as sustainable agriculture, food and health, energy and nature conservation. His research has been focused on environmental sciences, climate, biodiversity, nature conservation, energy transition, food production and sustainability of resource use and circularity. He acted independently to help find and implement solutions for sustainability issues using science and fact based integral multidisciplinary approaches. The nitrogen issue has always had his special attention because it serves as an example for tackling all sustainability problems in view of the systems approach needed to balance all actors, media, effects and primary human motives (energy, food, nature and health). In addition, it has many substantive issues that make the problems interesting in themselves, both multi-, trans- and mono disciplinary. Jan Willem played an important role in advising universities, governments, industry, media and citizens about the nitrogen issues and potential solutions. Jan Willem has initiated several (inter)national projects, committees and organisations that work on the issue of nitrogen in relation to food and energy production and the environment. He was treasurer of the International Geosphere Biosphere Program (IGBP) that coordinated large global earth science research programs. Until 2020 he was the CEO of the Louis Bolk Institute, a knowledge based institute working towards sustainable agriculture, nutrition and health. For an overview of the publications of Jan Willem before he worked at CML, please follow this link.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/e/erisman-jan-willem_-aug-2020_1-copy.jpg/erisman-jan-willem_-aug-2020_1-copy.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/jan-willem-erisman", "field": "environmental_biology", "classification_basis": "manual override", "rank": "Professor", "harmonized_tags": ["Nutrients & biogeochemical cycles", "Earth system & global change", "Ecosystem services & nature-based solutions"], "original_keywords": ["atmosphere- biosphere interaction", "ecosystem services", "nitrogen"], "raw_keywords": ["atmosphere- biosphere interaction", "ecosystem services", "environment", "liveable planet", "nitrogen", "sustainability"], "cml_themes": ["Future food", "Biodiversity"], "cml_scores": {"Biodiversity": 1.9, "Future food": 2.1, "Resources": 0.8, "Urban": 0.2, "Water": 0.5}}, {"name": "Alena Gsell", "title": "Assistant professor", "keywords": ["aquatic ecology", "food webs", "fungi", "host-parasite interactions", "plankton"], "tags": ["Assistant professor", "aquatic ecology", "food webs", "fungi", "host-parasite interactions", "plankton"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Alena is an aquatic ecologist with a strong background in epidemiology and a particular interest in parasitic fungi and the health of freshwater ecosystems. Alena began her academic journey by studying English and German language and literature, followed by a transformative year as a volunteer researcher with the Kalahari Meerkat Project in South Africa. She then completed her undergraduate studies in Biology at the University of Basel before pursuing a Master's degree in Epidemiology and Infection Biology at the Swiss Tropical and Public Health Institute. There, she focused on assessing accessibility of domestic dog populations to rabies vaccination in Tanzania. Alena earned her PhD at the NIOO-KNAW in 2013, studying the role of parasites in maintaining host genetic diversity. Following her PhD, she worked as a postdoctoral researcher at the IGB-Berlin, evaluating early warning signals for regime shifts in lakes within the BioDiversa+ project, LimnoTip. She later returned to NIOO-KNAW with an NWO VENI grant to explore the role of parasitic fungi in aquatic food webs. Alena also worked as a researcher at Wageningen Food Safety Research, focusing on natural toxins, particularly cyanotoxins. She is currently a guest researcher at NIOO-KNAW, with her up-to-date publication list available here. Since 2023, Alena has been an assistant professor at the Department of Environmental Biology, Institute of Environmental Sciences (CML), Leiden University. She teaches courses on biodiversity, aquatic ecology, and global change within the Biology programs, the MSc program Governance of Sustainability, and the CML Minor in Sustainable Development. Alena is dedicated to fostering a safe, inclusive, and supportive research environment that promotes productivity, creativity, and well-being for all. Alena’s primary research explores the role of fungal infections in aquatic ecosystems, investigating how these infections influence ecosystem functions and health, especially under the pressures of global change. Her second research focus is on the resilience of aquatic ecosystems and water quality, with a particular emphasis on urban blue infrastructure. In many urban water bodies, cyanobacterial blooms pose significant challenges; therefore, her third line of research seeks to understand the drivers of these blooms and their toxicity, while also developing potential mitigation strategies. Across all these research areas, Alena adopts a network perspective, emphasizing the importance of interactions and drivers within food webs. Her research methodologies include combinations of controlled experiments to understand mechanisms, field observations to explore the complex interplay of multiple drivers, long-term data analysis, and modeling.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/en/design-1.0/assets/images/no-photo.jpg", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/alena-gsell", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Biodiversity & community ecology", "Water & aquatic systems", "Soil, fungi & microbes"], "original_keywords": ["aquatic ecology", "food webs", "fungi", "host-parasite interactions", "plankton"], "raw_keywords": ["aquatic ecology", "food webs", "fungi", "host-parasite interactions", "plankton"], "cml_themes": ["Water", "Biodiversity"], "cml_scores": {"Biodiversity": 3.2, "Future food": 0.8, "Urban": 0.8, "Water": 3.4}}, {"name": "Emilia Hannula", "title": "Associate professor", "keywords": ["fungi", "land use change", "microbiomes", "networks", "soil ecology"], "tags": ["Associate professor", "fungi", "land use change", "microbiomes", "networks", "soil ecology"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Dr. Emilia Hannula is a soil ecologist passionate about all soil creatures and especially soil fungi. Emilia is an expert in soil ecology with special love for soil fungi. Her research focuses on understanding how composition, traits and interactions between soil biota regulate ecosystem functions, how disturbances affect soil biota and subsequent functions, and ultimately how soil biodiversity and functions can be restored. She works on topics such as plant-soil feedbacks, the effects of soil diversity on plant and animal health, temporal and spatial stability of microbiomes, effects of climate and land-use change on soil fungi, foodwebs, and functions, and on ways to steer soil fungal communities for better functioning (soil) ecosystem. She is especially interested in trait-based analyses of fungi and soil multifunctionality in relation to sustainable future. Her expertise includes tracing carbon through system using stable isotopes, (molecular) microbiome analysis, and networks. She completed her PhD in 2012 in Microbial Ecology department of NIOO-KNAW and Institute of Biology Leiden. After the PhD she did a post-doc in large European project (‘EcoFinders’) investigating the effects of land-use on soil fungal communities using molecular fingerprinting methods and tracing the carbon to soil organisms (DNA-SIP). After that she worked while in another European project (‘SoilCare’) and analysed soil fungi across Europe and further worked in another project as a post-doc in NIOO-KNAW department of Terrestrial Ecology on plant-soil feedbacks and soil fungi affecting plant communities and plant growth. In 2019 she gained personal funding from Tor and Maj Nessling foundation to study the effects of soil disturbances on soil fungi and carbon cycling in soils. She is currently a guest researcher in NIOO-KNAW and you can read about her previous work here. Since 2021, she has worked in the Institute of Environmental Sciences (CML) at Leiden University first as assistant professor (2021-2024) and currently as an associate professor (since 2024). She currently leads a NWO-KIC consortium linking soil health to human gut health and in 2024 obtained a VIDI-grant. She co-leads the programme on future food systems and leads the soil ecology group within CML. She strives to lead a group that is a safe, healthy, productive, and inclusive environment for everyone.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/h/hannula-emilia-cml.jpg/hannula-emilia-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/emilia-hannula", "field": "environmental_biology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Soil, fungi & microbes", "Biodiversity & community ecology", "Land use & landscapes"], "original_keywords": ["fungi", "land use change", "microbiomes", "ecological networks", "soil ecology"], "raw_keywords": ["fungi", "land use change", "microbiomes", "networks", "soil ecology"], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 3.6, "Future food": 0.4}}, {"name": "Alexander van Oudenhoven", "title": "Assistant professor", "keywords": ["coastal management", "ecological engineering", "ecosystem services", "human wellbeing", "indicators", "nature-based solutions", "sandy coasts"], "tags": ["Assistant professor", "coastal management", "ecological engineering", "ecosystem services", "human wellbeing", "indicators", "nature-based solutions", "sandy coasts"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Alexander van Oudenhoven is an environmental scientist who works on the interface between ecosystems and people. He is Education Director of the Governance of Sustainability master’s programme. Alexander specializes in quantifying and conceptualizing contributions that nature provides to humans, in relation to environmental management, spatial planning and decision making. For example, how do traditional ‘hard’ coastal protection structures (e.g. concrete dykes and barriers) compare to more nature-friendly management measures (e.g. beach nourishments), in terms of coastal protection, dune development and fishery enhancement. And how can we incorporate biodiversity and ecosystems in urban planning, so that the intensive rainfall can be captured and heat stress reduced? Alexander joined CML in May 2015 as a postdoctoral researcher as part of the NWO-TTW-funded NatureCoast project. In September 2018, he became Assistant Professor at the same institute. The main focus of Alexander’s education lies in the MSc programme Governance of Sustainability. He is acting Director of Education of the programme, supervises thesis students and coordinates the course ‘Governance of Biodiversity and Ecosystems’. Alexander also teaches at Leiden University College in the Hague, and gives guest lectures at the MSc Biology program and Minor Sustainable Development at Leiden University. Next to his work at Leiden University, Alexander was Lead Author at the ‘Intergovernmental science-policy Platform on Biodiversity and Ecosystem Services’ (IPBES), between 2015 and 2018. Open to all United Nations member countries, IPBES has become the leading intergovernmental body for assessing the state of the planet's biodiversity, its ecosystems and the essential services they provide to society. Alexander was responsible for the Regional Assessment for Europe and Central Asia, and is Leiden University’s IPBES focal point to the Ministry of Agriculture, Nature and Fisheries. In addition, Alexander is Co-Editor-in-Chief of Ecosystems and People, an interdisciplinary open access journal that addresses how biodiversity and ecosystems underpin human quality of life, and how societal activities and preferences drive changes in ecosystems. Alexander graduated from Wageningen University in 2008, where he obtained both his BSc and his MSc degree in the interdisciplinary field of Environmental Systems Analysis. He did an internship at the World Resources Institute (Washington, D.C.), and wrote an MSc thesis on the impacts of climate change on the spatial distribution of the oak processionary caterpillar (Thaumetopoea processionea), which constitutes a major health problem in western Europe. This work was done in collaboration with De Natuurkalender (‘Nature’s Calendar’), for which Alexander continued to work on spatial assessments of ticks (Lyme disease) and predicting pollen development (hay fever, the pollen planner). Between 2009 and early 2015, Alexander was a PhD researcher at Wageningen University, combining his PhD research with several other applied projects. His research aim was to quantify the effects of management on ecosystem services (thesis). Alexander developed a framework for indicator selection and applied and tested this framework during case studies in National Landscape ‘Het Groene Woud’ (The Netherlands), mangrove systems in Java (Indonesia) and semi-arid rangelands, both globally and in the Eastern Cape (Southern Africa). Next to his PhD, he also took part in several projects with the Netherlands Environmental Assessment Agency (PBL), developing a database of ecosystem services in relation to biodiversity, land use, land cover and management. Finally, Alexander also participated in a trans-disciplinary project in Indonesia called ‘Mangrove Capital’, together with colleagues from Deltares, Wetlands International, The Nature Conservancy, Indonesian universities and several other partners. Between 2015 and 2018, Alexander was active as a post-doctoral researcher in NatureCoast, a transdisciplinary project focusing on the ‘Sand Motor’, a so-called mega-nourishment; around 21 million m3 of sand were deposited along the Ter Heijde coast, which should be sufficient for the next twenty to thirty years. One of Alexander’s tasks was the integration of NatureCoast’s research data of 12 PhD reserachers into policy-relevant information. In his current research and education, van Oudenhoven aims to embed the various concepts about human-nature relationships in policy and practice, such as ecosystem services, nature-based solutions, ecological engineering, sustainable land management. Following an transdisciplinary approach, Alexander works with municipalities, provincial authorities, water boards and (inter)national decision-makers to solve real-world problems through nature-inclusive approaches. Think of using urban green (and blue) to reduce local temperatures, increase water buffering and improve leisure opportunities, or restoring rivers to prevent flooding, improve water quality and create a more beautiful and appreciated landscape. A key aspect of Alexander’s research is the development and analysis of indicators that are both scientifically valid and feasible, but also relevant to and perceived as legitimately developed by decision makers, managers and other stakeholders.", "projects": [{"title": "C-SCAPE - Sandy strategies for sustainable coastal climate change adaptation", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-c-scape---sandy-strategies-for-sustainable-coastal-climate-change-adaptation"}, {"title": "COMBINED - increasing biodiversity and climate change resilience in Dutch landscapes", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-combined---increasing-biodiversity-and-climate-change-resilience-in-dutch-landscapes"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/o/oudenhoven-alexander-van-cml.png/oudenhoven-alexander-van-cml.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/alexander-van-oudenhoven", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Ecosystem services & nature-based solutions", "Water & aquatic systems", "Sustainability assessment & indicators", "Wellbeing, sufficiency & post-growth"], "original_keywords": ["coastal management", "ecological engineering", "ecosystem services", "human wellbeing", "sustainability indicators", "nature-based solutions", "sandy coasts"], "raw_keywords": ["coastal management", "ecological engineering", "ecosystem services", "human wellbeing", "indicators", "nature-based solutions", "sandy coasts"], "cml_themes": ["Biodiversity", "Urban", "Water"], "cml_scores": {"Biodiversity": 2.3, "Future food": 0.4, "Resources": 0.4, "Urban": 2.0, "Water": 2.0}}, {"name": "Roy Remme", "title": "Assistant professor", "keywords": ["ecosystem services", "human-nature interactions", "nature-based solutions", "spatial analysis", "urban natural capital"], "tags": ["Assistant professor", "ecosystem services", "human-nature interactions", "nature-based solutions", "spatial analysis", "urban natural capital"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Roy Remme is an environmental scientist who works on urban nature and its importance to people, predominantly through the development and application of spatial decision-support tools. Roy is an environmental scientist who works on urban nature and its importance to people, predominantly through the development and application of spatial decision-support tools. He worked for the Natural Capital Project at Stanford University between 2018-2020, to co-develop and apply urban ecosystem service models in the InVEST (Integrated Valuation of Ecosystem Services and Tradeoffs) software suite. Between 2015-2018 Roy worked at RIVM, where he co-developed the Dutch Natural Capital Model and worked on the Atlas of Natural Capital and the TEEB-Stad tool, to assess, quantify, and value natural capital in the Netherlands. Simultaneously, he also helped develop the first ecosystem accounts for the Netherlands at CBS (Statistics Netherlands). Roy did his PhD research at Wageningen University, on spatial analysis of ecosystem services and biodiversity and the design and testing of ecosystem accounts. He studied Environmental Sciences (BSc) at Utrecht University, and Climate Studies (MSc) at Wageningen University. Roy is associate editor at the journal Ecosystem Services. Roy’s research revolves around the importance of nature in cities and the benefits it provides to people. He is interested in understanding how, when, and where nature impacts people, who benefits from nature, and how the benefits of nature can be leveraged to develop more sustainable, resilient, and healthy cities. His research straddles multiple fields, including ecology, geography, environmental economics, and environmental governance. He has a keen interest in developing and applying spatial models and tools that inform decision-making.", "projects": [{"title": "COMBINED - increasing biodiversity and climate change resilience in Dutch landscapes", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-combined---increasing-biodiversity-and-climate-change-resilience-in-dutch-landscapes"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/r/remme-roy-cml.jpg/remme-roy-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/roy-remme", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Ecosystem services & nature-based solutions", "Spatial analysis & GIS", "Urban nature & green infrastructure"], "original_keywords": ["ecosystem services", "human-nature interactions", "nature-based solutions", "spatial analysis", "urban natural capital"], "raw_keywords": ["ecosystem services", "human-nature interactions", "nature-based solutions", "spatial analysis", "urban natural capital"], "cml_themes": ["Urban", "Biodiversity"], "cml_scores": {"Biodiversity": 1.9, "Urban": 5.6}}, {"name": "Maarten Schrama", "title": "Associate professor", "keywords": ["community ecology", "cross-ecosystem linkages", "food webs", "large herbivore ecology"], "tags": ["Associate professor", "community ecology", "cross-ecosystem linkages", "food webs", "large herbivore ecology"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Maarten graduated at the University of Groningen in 2007, where he obtained both his BSc and his MSc degree in Ecology. He internships were at the University of Groningen where he worked on cooperative breeding in burying beetles, the University of Aberystwyth, where he worked on fish personalities and in Hluhluwe-iMfolozi Park in South Africa where he worked on the role of termites on decomposition in savanna ecosystems. Between 2008 and 2012, Maarten worked as a PhD researcher at the University of Groningen. The aim of his thesis was to understand the drivers behind food web assembly along a successional sequence. This research took place on the island of Schiermonnikoog, where a sequence of successional stages (a chronosequence) of 0-100 yrs presents the natural laboratory, an ideal opportunity to study this. He was able to show that cross-ecosystem linkages – in this case between the Wadden Sea and the salt marsh- are crucial for ecological succession to take place. Marine subsidy promotes the detritivore (brown) web in early succession, after which succession gets going and the herbivore (green) web takes over in intermediate successional stages. Towards late successional stages, the brown web once again takes over. Introduction of large herbivore grazers is the only way to make the system revert to the original food web composition. After his PhD he did a postdoc at the Netherlands Institute for Ecology (NIOO-KNAW), where he studied soil legacy effects of bio-energy crops. This research showed that different crops can have major legacy effects, where some crops have positive legacy effects on both soil food webs and ecosystem services, while other crops have very negative effects. These effects should be taken into account when deciding which crop to use. Two years ago, he received an NWO Rubicon grant to work on resistance and resilience of grassland ecosystems at the University of Manchester.. This research focused on the question how legacy effects of grassland use can interact with disturbances – and how this affects ecosystem functioning and invasibility of exotic species. Human pressures affect ecosystem in a wide range of ways, and often interact. Different pressures include the use of pesticides and other chemicals, eutrophication of water bodies, and changes in land use. My research intends to understand how these different pressures affect the structure of the aquatic food web. The approach will be twofold. I will use the wealth of information in the Netherlands gathered in different databases to investigate the links between pesticides, nutrient pollution, and aquatic biodiversity. Also, I plan to set up field and lab experiments to test hypotheses that are generated using the databases. Click following links for list of publications", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/schrama-maarten-cml.png/schrama-maarten-cml.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/maarten-schrama", "field": "environmental_biology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Biodiversity & community ecology", "Animal & movement ecology"], "original_keywords": ["community ecology", "cross-ecosystem linkages", "food webs", "large herbivore ecology"], "raw_keywords": ["community ecology", "cross-ecosystem linkages", "food webs", "large herbivore ecology"], "cml_themes": ["Biodiversity", "Future food"], "cml_scores": {"Biodiversity": 3.6, "Future food": 1.6, "Water": 1.2}}, {"name": "Yali Si", "title": "Assistant Professor", "keywords": ["biologging", "bird ecology", "geospatial analysis", "global environmental change", "movement ecology", "spatial ecology", "spatial epidemiology", "wildlife tracking"], "tags": ["Assistant Professor", "biologging", "bird ecology", "geospatial analysis", "global environmental change", "movement ecology", "spatial ecology", "spatial epidemiology", "wildlife tracking"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Yali Si is an ecologist who tries to 1) understand spatiotemporal ecological patterns and processes, 2) quantify the environmental mechanisms and global change impact on bird distribution, movement and diversity, ecosystem functioning, and disease patterns, and 3) develop sustainable measures to safeguard wildlife and human development. Yali quantifies spatiotemporal ecological patterns and processes using multidisciplinary methodologies including mathematic modelling, spatial analysis and statistics, Geographic Information System (GIS), Remote Sensing, and biologging. She received her BA in Land Resources Management at Henan Agricultural University, China and her MSc in Geo-information for Natural Resources and Environment Management at the International Institute for Geo-information Science and Earth Observation (ITC, University of Twente), The Netherlands. She completed her PhD in Global Change and Spatial Ecology in 2011 at Twente and Wageningen University. After that, Yali worked as a lecturer, assistant professor, and associate professor in the Department of Earth System Science at Tsinghua University, Beijing, China. Since 2021, she works as an assistant professor in the Institute of Environmental Sciences (CML) at Leiden University. She investigates the environmental mechanisms of the spatiotemporal bird distribution, migration, and biodiversity patterns, ecosystem functioning and disease patterns, and the impact of human activities including climate and land use change on these patterns and processes. Yali explores three main research lines: Yali teaches courses for Biology students: Ecosystem Ecology (bachelor) and Orientation on Biodiversity and Sustainability (master). She also teaches a bachelor course for Urban Studies: Sustainable City: Biodiversity in the city. At Tsinghua University, she taught a master course for Ecology students: Geospatial Analysis and Ecological Applications. For an overview of the publications of Yali's work before CML, please follow this link.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/yali-si_website.jpg/yali-si_website.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/yali-si", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Animal & movement ecology", "Spatial analysis & GIS", "Biodiversity & community ecology", "Earth system & global change"], "original_keywords": ["biologging", "bird ecology", "spatial analysis", "global environmental change", "movement ecology", "spatial ecology", "spatial epidemiology", "wildlife tracking"], "raw_keywords": ["biologging", "bird ecology", "geospatial analysis", "global environmental change", "movement ecology", "spatial ecology", "spatial epidemiology", "wildlife tracking"], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 3.6, "Future food": 0.4, "Resources": 0.8, "Urban": 1.4, "Water": 0.2}}, {"name": "Rita de Sousa e Silva", "title": "Assistant professor", "keywords": ["biodiversity", "environmental health", "nature-based solutions", "urban ecology", "urban nature"], "tags": ["Assistant professor", "biodiversity", "environmental health", "nature-based solutions", "urban ecology", "urban nature"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Dr Rita Sousa Silva is an ecologist and Assistant Professor in Urban Ecology at the Institute of Environmental Sciences (CML) at Leiden University. She is passionate about trees, and her research explores how green infrastructure can be planned and managed to support urban biodiversity and human well-being. Her recent projects have focused on small urban green spaces, from street greenery to tiny forests. Dr Rita Sousa Silva is an Assistant Professor in Urban Ecology at the Institute of Environmental Sciences (CML) at Leiden University. Her research and teaching revolve around understanding and communicating how people and nature interact in cities. At Leiden University, she teaches courses including Biodiversity in the City and Sustainable City in the Urban Studies bachelor's program. She has also been involved in the supervision, advising, tutoring, and training of PhD candidates and postdocs throughout her professional career. She completed her PhD in 2018 in Forest Sciences at KU Leuven, Belgium, researching the importance of tree diversity for the resilience of forest ecosystems against climate change. Afterwards, she moved to Canada, first to do a postdoc at the Institute of Temperate Forest Sciences and later at the Université du Québec à Montréal, where her work focused on understanding how the abundance and diversity of urban trees relate to the increased prevalence of pollen allergies. In 2021, Rita was awarded a research fellowship at the Young Academy for Sustainability Research at the University of Freiburg, Germany. During this time, she co-led a research project on the role of urban green spaces in helping protect people in Germany's cities during periods of high heat, as a result of climate change. Between 2023 and 2025, she co-chaired the Science-Policy-Society Interfacing Taskforce of the BiodivClim Knowledge Hub, focused on the biodiversity–climate nexus and part of the European Biodiversity Strategy for 2030. She is also a member of TreeDivNet, the largest network of biodiversity experiments worldwide. Rita's research focuses on urban nature, its ecological and social dimensions, and its planning and management in cities. Her current topics include: This research is interdisciplinary by its nature. It combines different domains of ecology (e.g., urban ecology, forest ecology, ecosystem ecology, functional ecology) with social and environmental health sciences, using both quantitative and qualitative approaches in an effort to produce evidence that can be effectively translated into policy solutions. Rita has ongoing research collaborations with colleagues across Europe and North America, working on biodiversity, nature-based solutions, climate resilience, environmental health, and sustainability.", "projects": [{"title": "Exploring Perceptions of Urban Forest Cultural Ecosystem Services in Brazil and the Netherlands", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/exploring-perceptions-of-urban-forest-cultural-ecosystem-services-in-brazil-and-the-netherlands"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/sousa-e-silva-rita-cml-2.png/sousa-e-silva-rita-cml-2.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/rita-de-sousa-e-silva", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Biodiversity & community ecology", "Ecosystem services & nature-based solutions", "Urban nature & green infrastructure"], "original_keywords": ["biodiversity", "environmental health", "nature-based solutions", "urban ecology"], "raw_keywords": ["biodiversity", "environmental health", "nature-based solutions", "urban ecology", "urban nature"], "cml_themes": ["Urban", "Biodiversity"], "cml_scores": {"Biodiversity": 3.7, "Urban": 3.4}}, {"name": "Geert de Snoo", "title": "Professor Conservation Biology", "keywords": ["biodiversity", "conservation biology", "ecology", "ecotoxicology", "sustainability"], "tags": ["Professor Conservation Biology", "biodiversity", "conservation biology", "ecology", "ecotoxicology", "sustainability"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "As a Professor, De Snoo's research and education concerns: conservation biology and environmental biology. As a Professor, his research and education concerns: conservation biology and environmental biology. More specific his research is about: - Conservation Biology: How can we contribute to ecological recovery and transition to sustainable land use? Here the focus is on biodiversity and agriculture. Apart from ecological aspects, also socio-economic aspects are investigated. - Environmental Biology: How can we reduce the impact of contaminants on biodiversity and ecosystems? More specifically, the focus is on the effects of pesticides on biodiversity and environmental quality. He has been the supervisor of about 40 Ph.D. Candidates. 1986 MSc Biology (Ecology / Ecotoxicology), Vrije Universiteit Amsterdam 1995 PhD Environmental Sciences, Leiden University Institute of Environmental Sciences (CML) From 2009 till 2012, De Snoo was Director of CML. Faculty Board From 2012 till 2019, De Snoo was the Dean of the Faculty of Science.", "projects": [{"title": "Environmental Biology", "url": "https://www.universiteitleiden.nl/onderzoek/onderzoeksprojecten/wiskunde-en-natuurwetenschappen/cml-environmental-biology"}, {"title": "Pesticides and the Environment", "url": "https://www.universiteitleiden.nl/en/research/research-output/science/pesticides-and-environment"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/geert-de-snoo-faculteitsbestuur.jpg/geert-de-snoo-faculteitsbestuur.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/geert-de-snoo", "field": "environmental_biology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Biodiversity & community ecology", "Conservation, invasion & resilience", "Ecotoxicology & chemical pollution"], "original_keywords": ["biodiversity", "conservation biology", "ecotoxicology"], "raw_keywords": ["biodiversity", "conservation biology", "ecology", "ecotoxicology", "sustainability"], "cml_themes": ["Biodiversity", "Future food"], "cml_scores": {"Biodiversity": 4.4, "Future food": 0.4, "Water": 0.4}}, {"name": "Kat Stewart", "title": "Associate professor", "keywords": ["biodiversity monitoring and management", "conservation genetics", "environmental change", "environmental dna (edna)", "hybridization"], "tags": ["Associate professor", "biodiversity monitoring and management", "conservation genetics", "environmental change", "environmental dna (edna)", "hybridization"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Kat Stewart is ultimately interested in biodiversity and the policy tools to manage it: she researches (i) the drivers of diversification in changing environments among individuals, populations, and species, and (ii) develops cutting-edge molecular tools for practical applications in biodiversity monitoring and management. Kat graduated from Laurentian University (Canada) with a B.Sc. (Hons) in Wildlife Biology while simultaneously getting a degree in Environmental Science. Here, she conducted her thesis work in Mexico studying a newly discovered lizard species. Thereafter, she attained her M.Sc. in Evolutionary Ecology at the University of Western Ontario (Canada) studying local genetic adaptation and sexual selection in song birds. She then completing her Ph.D. in 2013 at Queen’s University (Canada) where she studied the drivers of hybridization among North American frogs using a suite of genetic tools and field/behavioural assays across Canada and the United States. After graduating, she immediately started as an Assistant Professor at Tongji University in Shanghai, China, using environmental DNA (eDNA) to augment and facilitate conservation management of the critically endangered aquatic mammal, Yangtze Finless Porpoise (Neophocaena asiaeorientalis ssp. asiaeorientalis). Kat has lived, worked, and conduct research in a number of different locales spanning Canada, USA, Mexico, China, and The Netherlands. These opportunities have including rewarding positions as a Postdoctoral Research at the Institute for Biodiversity and Ecosystem Dynamics, University of Amsterdaman, as an Assistant Professor in Shanghai, China at Tongji University (2014-2017), and as an Adjunct Professor (2016-present) in Environmental Studies at Queen’s University. Kat’s passion for the natural world and conservation has seen her elected as the Vice-President (2009) and President (2010) of a local chapter for the Society for Conservation Biology, teach across various highschools, lead field expeditions for children to explore local wildlife, and intermittently work at the Toronto Zoo’s Conservation Department and Animal Hospital. She is also a strong advocate for diverse, equitable, and inclusive science, leading panel discussions on Women in Science and participating in a number of diversity groups across various universities. She currently acts as a Handling Editor for the journal Oikos, and as the Reviews Editor for the journal Evolutionary Ecology. Kat started in CML in 2021 and is currently teaching in both the B.Sc. and M.Sc. programmes, including Environmental Biology, Water & Toxicity, and Global Challenges: Sustainability. Visit Kat Stewart’s personal website here. Global biodiversity is increasingly under threat from human activity, ultimately increasing both rates of extinction and invasion.. Cradled within environmental change, Kat examines how eco-evolutionary elements affect different species (e.g., endangered and invasive) and uses genetics to monitor and manage them. Thus, her research uses molecular tools to understand biodiversity; processes that drive or diminish rates of diversification in changing environments, and practical applications quantifying biodiversity and preventing its loss. She combines field, lab and quantitative approaches across a range of taxa (frogs, lizards, birds, mammals, invertebrates), to create a groundbreaking hypothesis-driven research programme. Origins and maintenance of diversity under environmental change: One of the central challenges in evolutionary ecology is to the explain present-day distributions of diversity, and the nature and timing of the processes that shape them. An important facet of her research looks at how historical processes, such as fragmentation, shape range dynamics, contemporary geographic distributions, and opportunities for hybridization. She combines broad-scale fieldwork with genetic analyses, tests of mate preference, and in vitro hybridization experiments. She also seeks to understand gene-by-environmental interactions, looking at the effects of different eco-evolutionary processes on population persistence (evolutionary rescue) under changing environments, quantifying the genomic underpinnings of plastic responses. Using extensive field work, experimental evolution and Next-Generation Sequencing, this research seeks to answer questions that bridge dispersal ecology, population genomics and conservation management. This research will assist in predicting if and how species respond to environmental impacts (e.g. climate change), facilitating conservation prioritization and range-expansion corridors. Novel molecular tools for applied questions: This research theme uses environmental DNA (eDNA; DNA shed by organisms into their environs) methods to infer distribution, conservation status, and surveillance of rare or hard-to-study taxa (e.g. endangered or invasive) via species-specific or metabarcoding assays. With Tongji University and Queen’s University, she integrated conservation genetics in policy and management, predominately focusing on conserving and restoring a critically endangered aquatic mammal, the Yangtze Finless Porpoise. Being among the first researchers to introduce eDNA tools to China, her work at Tongji University (Assistant Professor) successfully demonstrated proof-of-concept for practitioners in the field, including methodological cost comparisons, and critical assessment of the spatiotemporal use of a nature reserve. Her research team and Kat herself also quantified fish communities throughout the Yangtze River Delta, including the prey an endangered aquatic mammal which have historically been over-fished, resulting in advice for overharvesting remediation. Currently, eDNA is one of the fastest developing monitoring tools, driving rapid advancement across fields; it is a featured theme for global conservation horizon scans and is now widely used to assess the ecology and biodiversity integrity of European waterways under the European Water Framework Directive. At CML, she will continue to gain a comprehensive understanding of native-invasive species interactions using eDNA methodologies.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/stewart-kathryn-cml.jpg/stewart-kathryn-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/kat-stewart", "field": "environmental_biology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Genetics & eDNA", "Conservation, invasion & resilience", "Earth system & global change"], "original_keywords": ["biodiversity monitoring and management", "conservation genetics", "global environmental change", "edna", "hybridization"], "raw_keywords": ["biodiversity monitoring and management", "conservation genetics", "environmental change", "environmental dna (edna)", "hybridization"], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 3.6, "Water": 0.6}}, {"name": "Emily Strange", "title": "Assistant professor", "keywords": ["biodiversity", "conservation biology", "invasive species", "plant communities", "resilience"], "tags": ["Assistant professor", "biodiversity", "conservation biology", "invasive species", "plant communities", "resilience"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Emily Strange is an ecologist whose work is grounded in conservation biology, invasion ecology and ecosystem resilience. Emily completed her PhD in South Africa in 2017 (Rhodes University) exploring the impact of biological control methods used to manage floating invasive aquatic plants on the native submerged plant communities (alternate stable states, regime shifts) and what these mean for the management and conservation of vital freshwater systems. Following her graduation, she worked as an Associate Lecturer and research project co-ordinator at Manchester Metropolitan University, co-developing a research project on invasive plant establishment and spread in the Ngorongoro Conservation Area of Tanzania. Whilst continuing this research development she was appointed Lecturer in Conservation Biology at Liverpool John Moores University (UK) from 2018-2019 prior to her present appointment as Assistant Professor at Leiden University. Emily teaches on BSc. and MSc. programmes including Conservation Biology, Sustainable Development and Biodiversity. Emily is co-chair of the Leiden Teachers Academy and won the 2022 Leiden University Teacher of The Year Award. Emily co-leads a research group, together with colleague Michiel Veldhuis, called WildCoLab Leiden. The group focuses on human wildlife coexistence, predominantly in east and southern Africa with projects on invasive plants, human wildlife conflict and community led conservation. Current projects also include investigations into invasive aquatic plants as facilitators of mosquitoes. For an overview of the publications of Emily's work before CML, please follow this link.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/strange_emily_4.jpg/strange_emily_4.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/emily-strange", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Biodiversity & community ecology", "Conservation, invasion & resilience", "Plant & vegetation ecology"], "original_keywords": ["biodiversity", "conservation biology", "invasive species", "plant communities", "resilience"], "raw_keywords": ["biodiversity", "conservation biology", "invasive species", "plant communities", "resilience"], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 4.6, "Water": 1.2}}, {"name": "Krijn Trimbos", "title": "Assistant professor", "keywords": [], "tags": ["Assistant professor"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Krijn Trimbos is an environmental biologist and molecular ecologist driven by improving biodiversity assessments through the application of novel molecular tools, to ultimately create a better understanding of how humans impact the environment. He is currently head of the department of Environmental Biology within the Institute of Environmental Sciences of Leiden University. Krijn graduated in 2007 from Leiden University with a doctorate in Biology. His studies pushed him towards two specialization trajectories, one focused on Medical Biology and one on Environmental Science. He conducted two internships within the field of Medical Biology revolving around immunological B and T-cell responses against Human Papilloma Virus both in The Netherlands and in Indonesia (Bali). During his last internship he worked on breeding success differences of Skylarks between organic and conventional arable farms. He started a PhD in 2007 at The Institute of Environmental Science (CML) Leiden University. His PhD topic combined the best of both study directions, lab and ecological field work within an Environmental Science scope, and focused on genetic patterns of Black-tailed Godwit populations and their implications for conservation. The aim was to investigate long term population dynamic processes in Black-tailed Godwit populations resulting from habitat fragmentation on three different spatial scales by using genetic tools. He demonstrated that egg shell membranes provide a good alternative DNA source compared to blood for these kind of studies. Additionally, he showed that habitat fragmentation, although geographically visible, has not yet lead to genetic differences between Dutch breeding populations yet. On a global scale three genetically distinct groups were recognized as subspecies, but again within these subspecies populations clear fragmentation affects could not be detected. Finally, he identified fitness correlates within Dutch Godwit breeding populations demonstrating that certain mutations in chicks lead to a higher body mass and return rate. Research entailed close collaboration with the Animal Ecology group of Theunis Piersma, University of Groningen and running three field seasons in South-West Friesland as a part of the long term demographic research that was conducted there by that group. After 2011 he continued his career at one of the Dutch provincial NGO’s (Landschap Noord-Holland) where he was project leader meadow bird protection for three years, which involved coordination, training and education of volunteer meadow bird protectors and writing and executing research projects involving meadow bird conservation. In 2014 Krijn returned to the academic world as University Lecturer at the Institute of Environmental Science (CML) where he got involved as a teacher and course coordinator in different teaching programs (Institute of Biology, Leiden University College and at CML) at Leiden University spanning multiple different courses and disciplines; field, sustainability, environmental science courses both on a BSc and MSc level. Since 2017 he has been appointed as Assistant Professor at Institute of Environmental Sciences during which he setup a successful and expanding research line in Environmental DNA (eDNA). Since 2022 he became head of the department of Environmental Biology within the Institute of Environmental Sciences of Leiden University. In his current research Krijn aims to improve biodiversity assessments through the application of novel molecular tools. Where his work originally focused more on increasing our understanding on population dynamic processes of single species through the usage of genetic techniques, his research has moved towards two slightly different focal points: In recent years his research in regards to focal point 1 has focused on abundance/eDNA concentration correlations for exoskeleton shedding invertebrates and bivalves, seed abundances in mouse feces through eDNA analysis to improve risk assessment methods, eDNA methylation and deriving age classes thereof, understanding detection probability of difficult to detect aquatic species and decreasing false positive estimates of species presence. His recent eDNA application studies have concentrated on the impacts of agricultural stressors & invasive species on aquatic communities. Additionally, he has studied the diet of African lions and how that might relate to National Park management. By collaborating closely with societal partners such as Waterboards, Chemical companies, Universities (of applied science), Naturalis Biodiversity Center, NGO’s, KWS, governments and many others Krijn intents to ensure high societal impact with his research. His future research will focus on studying plant pollinator networks using eDNA and the impact of additional agricultural and other stressors on soil and aquatic communities.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/t/trimbos-krijn-cml.png/trimbos-krijn-cml.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/krijn-trimbos", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Genetics & eDNA", "Biodiversity & community ecology"], "original_keywords": [], "raw_keywords": [], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 3.6, "Future food": 0.4}}, {"name": "Michiel Veldhuis", "title": "Assistant professor", "keywords": ["african savannas", "conservation", "ecological organization", "ecosystem stability", "global change"], "tags": ["Assistant professor", "african savannas", "conservation", "ecological organization", "ecosystem stability", "global change"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Michiel Veldhuis is an ecologist by training that aims to unlock our fundamental understanding of nature to those that manage or share biodiverse ecosystems in order to conserve or restore healthy landscapes. He aims to unravel the drivers of sustainable coexistence and provide evidence-based solutions to reduce conflict, protecting the wellbeing of people and wildlife. More information about current projects can be found at wildcolab.com.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/v/foto-michiel-veldhuis.png/foto-michiel-veldhuis.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/michiel-veldhuis", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Biodiversity & community ecology", "Conservation, invasion & resilience", "Animal & movement ecology", "Earth system & global change", "Land use & landscapes"], "original_keywords": ["african savannas", "conservation biology", "ecological organization", "ecosystem stability", "global environmental change"], "raw_keywords": ["african savannas", "conservation", "ecological organization", "ecosystem stability", "global change"], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 3.8, "Water": 0.2}}, {"name": "Martina Vijver", "title": "Scientific director/Professor", "keywords": ["ecotoxicology", "metals", "microplastics", "nanoecotoxicology", "pesticides"], "tags": ["Scientific director/Professor", "ecotoxicology", "metals", "microplastics", "nanoecotoxicology", "pesticides"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Her research field is in Ecotoxicology. Obtaining realistic predictions and measurements of how existing and emerging chemical stressors potentially affect our natural environment and the organisms living therein is essential to provide the necessary tools to assess and mitigate ecosystem threats. Vijver's research field is in Ecotoxicology. While the basic idea is straightforward, attaining reliable estimates on the fate, the actual uptake and effects of chemicals on species and their overall effect on ecosystems has proven to be notoriously challenging. This research line is aimed is to predict the impact of environmental stressors across increasing environmental complexity and spatiotemporal scales. Vijver's passion is to work on these innovative challenges in which some aspects are a must for her: that is a. field representative setting and accounting for dynamics is key, b. the whole chain of fate and behaviour, uptake and elimination, responses should be considered, c. preferably quantitative, d. integrative. Data collection will be done following different approaches, ranging from lab-derived experiments, to outdoor mesocosms, to in situ experiments in the field, monitoring data and secondary data analyses. She applies an ecosystems approach in part of our work, next to work at the individual species level, and maintain mechanistic work using sub-cellular and molecular level (see this link) using diverse communities and ecosystems. For all research, models are derived using the topic specific knowledge on processes and mechanisms. Focus currently: engineered nanomaterials, pesticides, metals, microplastics Due to the selected cookie settings, we cannot show this video here.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/v/vijver-martina-cml.png/vijver-martina-cml.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/martina-vijver", "field": "environmental_biology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Ecotoxicology & chemical pollution"], "original_keywords": ["ecotoxicology", "metals", "plastic pollution", "nanoecotoxicology", "pesticides", "engineered nanomaterials", "mesocosm", "multiple stressors"], "raw_keywords": ["ecotoxicology", "metals", "microplastics", "nanoecotoxicology", "pesticides"], "cml_themes": ["Biodiversity", "Water"], "cml_scores": {"Biodiversity": 1.6, "Future food": 0.6, "Resources": 0.4, "Water": 1.0}}, {"name": "Marco Visser", "title": "Assistant professor", "keywords": [], "tags": ["Assistant professor"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Marco Visser studies how biodiversity and ecosystems respond to multiple stressors, including climate change, disease, and pollution. For questions about the \"Bestrijdingsmiddelen Atlas\" you can contact him via this email: bma@cml.leidenuniv.nl Marco’s research interests lie at the intersection of empirical and theoretical ecology, with a focus on synthesizing ecological and evolutionary theory with empirical data through mathematical, statistical, and computational methods. His overarching research theme is cross-scale integration—scaling ecological processes from the microscopic level up to ecosystems, with an emphasis on how individual traits shape biodiversity and how these processes influence ecosystem dynamics and climate feedback. Marco has conducted fieldwork in a variety of ecosystems, including the primeval forests of Poland and tropical rainforests in Malaysia and Panama. After earning his PhD in 2016, where he investigated mechanisms structuring tropical forest diversity across spatial, temporal, and organizational scales, he advanced his research during a postdoctoral position at Princeton University’s Department of Ecology and Evolutionary Biology. There, he further developed his expertise in biophysics, remote sensing, and mathematical ecology (2016-2021). In 2021, Marco joined the Institute of Environmental Sciences (CML) at Leiden University as an assistant professor. Here, he continues his work on understanding the rapidly evolving dynamics of global forests and their feedbacks on biodiversity and climate. In recent years, Marco has expanded his research to address the critical challenge of chemical pollution, particularly focusing on pesticides. As the project leader of the Dutch Pesticide Atlas project - a national tool that provides a standardized scientifically validated dataset to serve as a “common truth” for societal debate - he contributes to fostering informed, data-driven discussions: “a communication tool that enables a conversation based on the same numbers.” His team’s work with the Dutch Pesticide Atlas supports cross-scale research on pesticide impacts, enabling public authorities, scientists, and society to make decisions rooted in a unified, transparent data foundation. Marco is deeply committed to fostering a work environment that promotes curiosity, safety, inclusivity, and productivity. He believes in the power of diverse perspectives to inspire scientific discovery and strives to create a lab culture that encourages everyone to contribute to understanding the intricate workings of our beautiful blue planet. Read more at my website.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/v/visser-marco-cml.png/visser-marco-cml.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/marco-visser", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Biodiversity & community ecology", "Climate, energy & decarbonisation", "Ecotoxicology & chemical pollution"], "original_keywords": [], "raw_keywords": [], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 3.4, "Resources": 0.3, "Water": 0.4}}, {"name": "Lotte de Vries", "title": "Assistant professor", "keywords": [], "tags": ["Assistant professor"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Depa
