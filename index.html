": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Ecotoxicology & chemical pollution", "Life cycle assessment"], "original_keywords": ["environmental chemistry", "life cycle assessment"], "raw_keywords": ["environmental chemistry", "life cycle impact assessment (lcia)"], "cml_themes": ["Resources"], "cml_scores": {"Biodiversity": 0.8, "Future food": 0.4, "Resources": 1.0, "Water": 0.4}}, {"name": "Hai Lin", "title": "Professor by special appointment", "keywords": ["data analytics", "high performance computing", "modelling of environmental systems", "simulation of environmental systems"], "tags": ["Professor by special appointment", "data analytics", "high performance computing", "modelling of environmental systems", "simulation of environmental systems"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Lin obtained his PhD from Delft University of Technology in 1993. After graduation (ir.) in Applied Mathematics at Delft University of Technology. He worked at TNO in Rijswijk from 1986 to 1990. In 1990 he joined the Department of Applied Mathematics of Delft University of Technology. Dr. Lin has many years of research experience in mathematical modelling and high performance computing. In recent years his research interests shifted to parallel numerical algorithms, modelling and simulation of large scale systems. Examples of ongoing research projects include improving the forecast of volcanic ash (cloud) transport with data assimilation, and studying the impact of wind- and solar energy to the stability of electrical power grid. Prof.dr.ir. Hai Xiang Lin will share his knowledge in mathematical modelling and high performance computing with other researchers of CML. He will actively cooperate with the Leiden Centre of Data Science (Prof.dr. Jaap van den Herik) and LIACS. Given his main appointment in Delft and having a chair now at CML will strongly support the further development of the Leiden-Delft-Erasmus Centre for Sustainability. Furthermore, he is visiting professor of the University of Chinese Academy of Sciences and Shandong University, and has been collaborating with a number of universities in China for many years.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/l/hai_xiang_lin_200_250.jpg/hai_xiang_lin_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/hai-lin", "field": "industrial_ecology", "classification_basis": "department", "rank": "Professor by special appointment", "harmonized_tags": ["Modelling, scenarios & integrated assessment", "Data science, computing & AI"], "original_keywords": ["data analytics", "high performance computing", "environmental modelling"], "raw_keywords": ["data analytics", "high performance computing", "modelling of environmental systems", "simulation of environmental systems"], "cml_themes": ["Resources"], "cml_scores": {}}, {"name": "Heath Logan", "title": "Assistant professor", "keywords": ["consumer goods", "plca", "ssbd", "textiles"], "tags": ["Assistant professor", "consumer goods", "plca", "ssbd", "textiles"], "organisation": ["Science", "Institute of Environmental Sciences (CML)"], "summary": "Heath is researching the nexus between the lifetimes of consumer goods (textiles, footwear, and cosmetics), their production and end of life management, and the potential of emerging technologies in assessing the prospective environmental impacts of the design of consumer goods for safe and sustainable futures.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/l/logan-heath-cml.jpg/logan-heath-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/heath-logan", "field": "industrial_ecology", "classification_basis": "keywords (no department listed): IE=1, EB=0", "rank": "Assistant professor", "harmonized_tags": ["Circular economy & critical materials", "Life cycle assessment", "Sustainability assessment & indicators"], "original_keywords": ["consumer goods", "prospective life cycle assessment", "safe and sustainable by design", "textiles"], "raw_keywords": ["consumer goods", "plca", "ssbd", "textiles"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 2.2}}, {"name": "Stefano Merciai", "title": "Researcher", "keywords": ["hybrid supply-use tables", "input-output modeling", "material-flow analysis"], "tags": ["Researcher", "hybrid supply-use tables", "input-output modeling", "material-flow analysis"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Stefano started as a researcher at the Industrial Ecology department of CML in August 2019. Stefano graduated at University of Rome “La Sapienza” at the Faculty of Statistics and Economics in 2004. He started working at ISMEA, a research institute of the Italian Ministry of Agriculture, where his main task was the implementation and development of a computable general equilibrium model for the economic impact assessment of agricultural policies. During the years at ISMEA he also developed several tools for the analysis of the supply chain of agricultural products. The collaboration with ISMEA has teminated in 2016. In 2006 he started his PhD always at the University of Rome. His research aimed to develop a physical input-output model for a quantitative analysis of economic systems. During his PhD he visited for 9 months the CML-University of Leiden where he was introduced to LCA techniques. Influenced by the studies at CML, he developed a multi-dimensional input-output model where physical and economic principles coexisted in an unique tool. In 2010 he defended his thesis and soon after started working for 2.-0LCA consultants in Aalborg Denmark. There he had the opportunity to work for the construction of Exiobase, a multi-regional input-output database, within the EU-funded projects CREEA and DESIRE. His main task has been that of writing the algorithm which generated the hybrid tables of Exiobase v2 and v3. At the same time has been involved in several projects for the calculation of the carbon footprint of products and regions, the indirect land use change and LCAs. Stefano aims to develop multi-disciplinary tools for an organic and comprehensive analysis of production and consumption processes. His research focuses on developing multi-layer supply and use tables and on techniques for reconciling different data sources.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/m/cml-stefano-merciai-.jpg/cml-stefano-merciai-.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/stefano-merciai", "field": "industrial_ecology", "classification_basis": "department", "rank": "Researcher", "harmonized_tags": ["Input-output analysis & footprints", "Food systems", "Material & substance flow analysis"], "original_keywords": ["hybrid supply-use tables", "input-output analysis", "material flow analysis"], "raw_keywords": ["hybrid supply-use tables", "input-output modeling", "material-flow analysis"], "cml_themes": ["Resources", "Future food"], "cml_scores": {"Future food": 2.7, "Resources": 2.1}}, {"name": "José Mogollón", "title": "Associate professor", "keywords": ["biogeochemical modelling", "earth system", "environmental modelling", "integrated assessment models (iams)"], "tags": ["Associate professor", "biogeochemical modelling", "earth system", "environmental modelling", "integrated assessment models (iams)"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "José has worked over 11 years on quantifying and modeling Earth system processes and their responses to human pressures As a researcher with a doctorate in geochemistry, he has worked for over 11 years on quantifying and modeling Earth system processes and their responses to human pressures. He obtained his Ph.D. at Utrecht University and afterward worked as a researcher at the Alfred Wegener Institute Helmholtz Centre for Polar and Marine Research, and at the NIOZ Royal Netherlands Institute for Sea Research. He has worked in several FP7 and H2020 projects and furthermore received a Marie Skłodowska-Curie Individual Fellowship to research Coastal Hypoxia at Utrecht University in conjunction with the PBL Netherlands Environmental Assessment Agency. His interests are quite broad, but generally pertain to quantifying the influence and the pressures that society inflicts on the environment. This involves understanding the global biogeochemical cycles of carbon, nitrogen, and phosphorus and how the Anthropocene has affected the flows and stocks of these elements through various ecosystems and reservoirs. For this he uses a range of techniques, including statistical, process-based, and mass/flow-balance models.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/m/mogollon-jose-cml.png/mogollon-jose-cml.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/jose-mogollon", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Modelling, scenarios & integrated assessment", "Earth system & global change", "Nutrients & biogeochemical cycles", "Sustainability assessment & indicators"], "original_keywords": ["biogeochemical modelling", "earth system", "environmental modelling", "integrated assessment models"], "raw_keywords": ["biogeochemical modelling", "earth system", "environmental modelling", "integrated assessment models (iams)"], "cml_themes": ["Water", "Future food", "Biodiversity", "Resources", "Urban"], "cml_scores": {"Future food": 0.5, "Water": 1.3}}, {"name": "Carlos Felipe Blanco Rocha", "title": "Assistant professor", "keywords": ["ecological risk assessment", "emerging technologies", "life cycle assessment (lca)", "safe and sustainable-by-design (ssbd)", "social lca (s-lca)", "uncertainty analysis"], "tags": ["Assistant professor", "ecological risk assessment", "emerging technologies", "life cycle assessment (lca)", "safe and sustainable-by-design (ssbd)", "social lca (s-lca)", "uncertainty analysis"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology", "Department of Industrial Ecology"], "summary": "Carlos Felipe obtained his PhD degree at the Institute of Environmental Sciences (CML), where he also obtained his M.Sc. degree in Industrial Ecology. He also holds a Bachelor’s degree in Environmental Engineering from Universidad de Los Andes in Colombia. Between 2006-2014, Carlos Felipe worked in the mining industry as a Health, Safety, Environment and Community Relations (HSEC) manager in several countries in Latin America including Chile, Peru, Colombia, Guyana and Brazil. In these roles, he led social and environmental impact studies for mining and minerals exploration projects, developed environmental mine closure plans and served as a lead EHS critical incident investigator. He was also tasked with environmental auditing and implementing ISO14001 and OHSAS18001 standards and related training programmes. In the period 2014-2018 Carlos Felipe worked as an independent sustainability consultant for the mining, energy and forestry sectors and developed software solutions for stakeholder engagement programs in several large-scale mining projects. In his PhD thesis, Carlos Felipe proposed various methods to appraise the safety and sustainability of emerging technologies and demonstrated them with a case study of high-efficiency III-V/Silicon solar cells. In his MSc thesis, Carlos Felipe developed a framework to assess ecosystem services in LCA and demonstrated it by a case study of water supply for mining in the north of Chile. The M.Sc. thesis was awarded the Stans prize by CML in 2016. Carlos Felipe’s current research focus is Life Cycle Sustainability Assessment (including LCA and Social-LCA) and Ecological Risk Assessment of emerging technologies with a special focus on safe and sustainable design of energy technologies. Developing quantitative forward-looking models in these domains requires comprehensive and robust methods for scenario analysis, uncertainty analysis and global sensitivity analysis. Carlos Felipe’s current research aims to increase the applicability and usefulness of such methods in the field of sustainability and to establish linkages with developments in related fields such as Bayesian Analysis and Machine Learning. Carlos Felipe is currently a main lecturer for the course Society’s Metabolism in the Industrial Ecology master’s programme and supports the LCA Practice & Reporting course offered by the same programme. He is also the main lecturer for the course Environment & Development offered by Leiden University College.", "projects": [{"title": "Safe and Sustainable by Design framework for the next generation of Chemicals and Materials (SSbD4Chem)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-ssbd4chem"}, {"title": "Strategies for the Evaluation and Assessment of Ocean based Carbon Dioxide Removal (SEAO2-CDR)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/seao2-cdr"}, {"title": "Circular Circuits", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-circuits"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/b/carlos-blanco.jpg/carlos-blanco.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/carlos-felipe-blanco-rocha", "field": "industrial_ecology", "classification_basis": "keywords (both departments listed): IE=24, EB=4", "rank": "Assistant professor", "harmonized_tags": ["Life cycle assessment", "Sustainability assessment & indicators", "Decision support & uncertainty", "Ecotoxicology & chemical pollution"], "original_keywords": ["ecological risk assessment", "emerging technologies", "life cycle assessment", "safe and sustainable by design", "social life cycle assessment", "uncertainty & sensitivity analysis"], "raw_keywords": ["ecological risk assessment", "emerging technologies", "life cycle assessment (lca)", "safe and sustainable-by-design (ssbd)", "social lca (s-lca)", "uncertainty analysis"], "cml_themes": ["Resources", "Biodiversity"], "cml_scores": {"Biodiversity": 1.2, "Resources": 1.0, "Water": 0.8}}, {"name": "Laura Scherer", "title": "Associate Professor / Guest", "keywords": ["animal welfare", "biodiversity", "food", "water"], "tags": ["Associate Professor / Guest", "animal welfare", "biodiversity", "food", "water"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Laura Scherer is an associate professor at Leiden University's Institute of Environmental Sciences (CML). She is interested in research on impact assessment and prioritization related to biodiversity, water, climate, and animal welfare, with applications especially in the food sector. She contributed to reports of FAO and UNEP and currently works in the Global Guidance for Life Cycle Impact Assessment Indicators and Methods (GLAM) project hosted by UNEP. She leads a work package on climate and health impacts of shifting lifestyles within the Horizon 2020 project 1.5° Lifestyles and co-leads the Horizon Europe project BAMBOO, which focuses on biodiversity impacts of non-food biomass along global supply chains. Her team's main research contribution to the BAMBOO project is the development of impact assessment methods for functional diversity. Laura obtained her PhD from ETH Zurich in 2016. During her doctoral studies, she analysed the environmental impacts of water consumption and degradation at regional and global scales. She applied her research to the agriculture and energy sectors. Afterwards, as a postdoctoral researcher at VU Amsterdam, she coordinated the European research project VITAL where she evaluated the opportunities and constraints for sustainable intensification of agriculture in Europe.", "projects": [{"title": "Bamboo", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-bamboo"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/scherer_200_250.jpg/scherer_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/laura-scherer", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Food systems", "Biodiversity & community ecology", "Water & aquatic systems"], "original_keywords": ["animal welfare", "biodiversity", "food", "water"], "raw_keywords": ["animal welfare", "biodiversity", "food", "water"], "cml_themes": ["Future food", "Water", "Biodiversity"], "cml_scores": {"Biodiversity": 1.8, "Future food": 3.9, "Resources": 0.4, "Water": 2.0}}, {"name": "Bernhard Steubing", "title": "Associate professor", "keywords": ["life cycle assessment (lca)", "life cycle inventory databases (ecoinvent)", "material flow analysis (mfa)", "optimalization"], "tags": ["Associate professor", "life cycle assessment (lca)", "life cycle inventory databases (ecoinvent)", "material flow analysis (mfa)", "optimalization"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "In 2015 Bernhard joined CML at Leiden University as a tenure-track assistant professor, however, first embarked on a year of sailing across the Atlantic. In 2022 Bernhard completed his tenure track. Bernhard Steubing works as an Associate Professor in the Department of Industrial Ecology at the Institute of Environmental Sciences (CML) at Leiden University. Bernhard specializes on the further development of Life Cycle Assessment (LCA) and related methods and applies these to answer sustainability-related questions in energy, electric mobility, the built environment, and other areas. Currently, he dedicates much effort to the advancement of data, methods, and open software for future-oriented, i.e. prospective (or ex-ante) LCA, to provide decision support for the transition to a more circular and sustainable economy. Bernhard has received his PhD from EPFL on the availability and optimal use of biomass for bioenergy, while working at Empa. During his PostDoc at ETH Zurich, he coordinated a project on the optimal environmental use of wood resources and was part of the ecoinvent expert group. He then also started the development of the open source LCA software Activity Browser. A complete overview of the publications of Bernhard's work - including publications before CML - can be found here: Google Scholar and Scopus.", "projects": [{"title": "TranSensusLCA", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-transensuslca"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/s/bernhard-steubing---cml.jpg/bernhard-steubing---cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/bernhard-steubing", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Life cycle assessment", "Data science, computing & AI", "Material & substance flow analysis", "Modelling, scenarios & integrated assessment"], "original_keywords": ["life cycle assessment", "life cycle inventory", "material flow analysis", "optimisation"], "raw_keywords": ["life cycle assessment (lca)", "life cycle inventory databases (ecoinvent)", "material flow analysis (mfa)", "optimalization"], "cml_themes": ["Resources", "Urban"], "cml_scores": {"Resources": 2.8, "Urban": 0.8}}, {"name": "Oliver Taherzadeh", "title": "Assistant professor", "keywords": ["environmental footprinting", "global food trade", "post-growth", "sustainable food systems", "water-energy-land system"], "tags": ["Assistant professor", "environmental footprinting", "global food trade", "post-growth", "sustainable food systems", "water-energy-land system"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Oli is an environmental economist studying the sustainability of global food systems with a focus on transitions of diets, food trade, and farmer livelihoods. After working as a researcher at the Stockholm Environment Institute, I completed my PhD at Cambridge University on a Vice-Chancellor’s scholarship, investigating resource insecurity of global supply chains. After completing my PhD, I worked in Kyoto as a Senior Researcher at the Research Institute for Humanity and Nature, advancing environmental footprint assessment of diets, households, and global food systems. I teach the Socio-Economic Policy Evaluation course of the BSc Sustainable Societies programme and lecture on macroeconomic footprinting methods. My current research integrates global food system models with microdata on consumers, farmers, and food companies to assess their roles in sustainable food transitions. I coordinate this work within the Horizon Europe GreenGrocer project, development of MATILDA (Micro-Macro Assessment Tool to Identify Low-impact Dietary Actions), and actor-level modelling of farming systems. My work has been featured in the UN FAO 2025 State of Food and Agriculture report, media outlets (The Guardian, The Ecologist, The Conversation), PNAS, Nature Food, Nature Sustainability, Global Environmental Change, and Environmental Research Letters. I have also contributed to several expert consultations (UNEP, OECD and Defra) on applying environmental data to sustainability policy.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/t/taherzade-oliver-cml.jpg/taherzade-oliver-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/oliver-taherzadeh", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Food systems", "Input-output analysis & footprints", "Climate, energy & decarbonisation", "Land use & landscapes", "Policy, economics & governance", "Sustainability assessment & indicators"], "original_keywords": ["environmental footprints", "global food trade", "post-growth", "sustainable food systems", "water-energy-land system"], "raw_keywords": ["environmental footprinting", "global food trade", "post-growth", "sustainable food systems", "water-energy-land system"], "cml_themes": ["Future food", "Resources"], "cml_scores": {"Biodiversity": 0.4, "Future food": 5.1, "Resources": 1.8, "Water": 0.5}}, {"name": "Nils Thonemann", "title": "Assistant professor", "keywords": ["computational techniques", "emerging technologies", "life cycle assessment (lca)", "planetary boundaries", "quantitative sustainability assessment"], "tags": ["Assistant professor", "computational techniques", "emerging technologies", "life cycle assessment (lca)", "planetary boundaries", "quantitative sustainability assessment"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Distinguished environmental scientist and engineer specializing in quantitative sustainability assessment, focusing on prospective assessments of emerging technologies while considering planetary boundaries. Nils holds a PhD in Engineering from Ruhr University Bochum, Germany, focusing on the prospective environmental assessment of emerging carbon capture and use technologies. Before his PhD studies, he worked as a Postdoctoral fellow at the Technical University of Denmark and Fraunhofer UMSICHT in Germany, conducting studies on the aviation industry, developing characterization factors for plastic pollution, and advancing the LCA framework (e.g., data collection and interpretation). He obtained an MA in Sustainable Economics and Management from Kassel University, Germany, and a BSc in Business Chemistry from the University of Düsseldorf, Germany. Nils Thonemann aims to continue pushing the boundaries of prospective LCA methodology. Nils is particularly interested in coupling prospective life cycle assessment (LCA) with dynamic material flow analysis (MFA) and considering planetary boundaries. This forward-looking approach reflects his commitment to advancing sustainability assessment methodologies and addressing pressing environmental challenges.", "projects": [{"title": "Groeien met Groen Staal. Towards a sustainable future with green steel", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-groeien-met-groen-staal.-towards-a-sustainable-future-with-green-steel"}, {"title": "Safe and Sustainable by Design framework for the next generation of Chemicals and Materials (SSbD4Chem)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-ssbd4chem"}, {"title": "Strategies for the Evaluation and Assessment of Ocean based Carbon Dioxide Removal (SEAO2-CDR)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/seao2-cdr"}, {"title": "RAW", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-raw"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/t/picture_nils_thonemann.jpg/picture_nils_thonemann.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/nils-thonemann", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Sustainability assessment & indicators", "Data science, computing & AI", "Earth system & global change", "Life cycle assessment"], "original_keywords": ["computational techniques", "emerging technologies", "life cycle assessment", "planetary boundaries", "quantitative sustainability assessment"], "raw_keywords": ["computational techniques", "emerging technologies", "life cycle assessment (lca)", "planetary boundaries", "quantitative sustainability assessment"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 1.4, "Water": 0.2}}, {"name": "Arnold Tukker", "title": "Professor Industrial ecology", "keywords": ["circular economy", "environmental input-output analysis", "industrial ecology"], "tags": ["Professor Industrial ecology", "circular economy", "environmental input-output analysis", "industrial ecology"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Arnold Tukker is Professor of Industrial Ecology at the Institute of Environmental Sciences (CML) at Leiden University. Arnold Tukker was for 70% of his time Director of the Institute of Environmental Sciences (CML) from October 1, 2013 until August 31, 2022 at Leiden University. Before October 2013, he was Business line manager Societal Innovation and Economy at TNO, a large not for profit research organization in the Netherlands, where he retains a 30% position as senior researcher. Arnold set up prominent EU projects in the field of sustainable product design (SusProNet) and sustainable consumption and production (SCORE!) and was core member of the 10 Million Euro Dutch Knowledge Network on Sustainable System Innovations. He currently co-ordinates a string of major programs of some 15 million Euro with some 20 key European research institutes in the field of resource-efficiency, a.o. constructing the world’s most ambitious and detailed global energy/resource/economic input-output databases and models (EXIOBASE). He authored 6 books, 47 refereed papers and 7 special issues on sustainability research. He has been engaged with work of the UN on the Green Economy Initiative, the Resources Panel, the Ten Year Framework of Programs on Sustainable Consumption and Production, and Sustainable Development Goals.", "projects": [{"title": "Circular Circuits", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-circuits"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/t/tukker-arnold-cml.jpg/tukker-arnold-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/arnold-tukker", "field": "industrial_ecology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Circular economy & critical materials", "Input-output analysis & footprints"], "original_keywords": ["circular economy", "input-output analysis"], "raw_keywords": ["circular economy", "environmental input-output analysis", "industrial ecology"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 3.1}}, {"name": "Ester van der Voet", "title": "Professor emeritus", "keywords": ["biodiversity", "industrial ecology", "life cycle assessment (lca)", "material flow accounting (mfa)", "substance flow analysis (sfa)", "sustainability indicators", "urban studies"], "tags": ["Professor emeritus", "biodiversity", "industrial ecology", "life cycle assessment (lca)", "material flow accounting (mfa)", "substance flow analysis (sfa)", "sustainability indicators", "urban studies"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Ester van der Voet is employed as Professor by Leiden University at the Department Industrial Ecology of the Institute of Environmental Sciences. Ester van der Voet is Emeritus Professor of Sustainable Resource Use at CML's Department Industrial Ecology. Within the field of Industrial Ecology, she specialises in methodology development: life-cycle assessment, material flow analysis, substance flow analysis, natural resource accounting, and indicator development. These methodologies she applies to in different topical areas, especially within the bio-based economy and in metals and the circular economy. She has initiated two MSc programs in Industrial Ecology: a program between Leiden University and TU Delft, and an international program of Leiden, Delft, Graz University and Chalmers University in Sweden. She has conducted many research projects for the EU and in other international consortia. She is a member of UNEP’s International Resource Panel. For more information about her research for the past 5 years, please check this link.", "projects": [{"title": "Circular Economy Modelling for Climate Change Mitigation (CIRCOMOD)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-economy-modelling-for-climate-change-mitigation-circomod"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/v/ester-van-der-voet_188x250.jpg/ester-van-der-voet_188x250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/ester-van-der-voet", "field": "industrial_ecology", "classification_basis": "department", "rank": "Professor emeritus", "harmonized_tags": ["Material & substance flow analysis", "Biodiversity & community ecology", "Life cycle assessment", "Sustainability assessment & indicators"], "original_keywords": ["biodiversity", "life cycle assessment", "material flow analysis", "substance flow analysis", "sustainability indicators", "urban studies"], "raw_keywords": ["biodiversity", "industrial ecology", "life cycle assessment (lca)", "material flow accounting (mfa)", "substance flow analysis (sfa)", "sustainability indicators", "urban studies"], "cml_themes": ["Resources", "Urban"], "cml_scores": {"Biodiversity": 1.0, "Resources": 3.6, "Urban": 0.6}}, {"name": "Ranran Wang", "title": "Associate professor", "keywords": ["capital", "co2", "drivers", "environmental footprint", "green infrastructures", "trade", "water use"], "tags": ["Associate professor", "capital", "co2", "drivers", "environmental footprint", "green infrastructures", "trade", "water use"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Ranran Wang is an assistant professor whose main areas of interest include trade and environment, green infrastructures, water use efficiency. Ranran’s research focusses on better elucidate and leverage the human effects on natural environments. Her main areas of interest include trade and environment, green infrastructures, water use efficiency, water-energy nexus, and the CO2-GDP relationship. As a systems modeler, she employs and advances systems modeling approaches such as the environmentally-extended multi-regional input-output (MRIO) analysis, system dynamics modeling, and econometric analysis. Prior to CML, she was an assistant professor of water and energy at the University of Twente in the Netherlands. For over a decade, she employed and improved systems modeling tools to investigate the anthropogenic impacts, through local water infrastructures, regional grids, and global supply chains, on freshwater environments. They have been published in top peer-reviewed journals. She received a B.Sc. in geography from Nanjing University, China, and a Ph.D. and a master’s degree in environmental science from Yale School of the Environment in the United States. Ongoing research projects: For an overview of the publications of Ranran's work before CML, please follow this link.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/w/wang-ranran-cml.jpg/wang-ranran-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/ranran-wang", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Input-output analysis & footprints", "Climate, energy & decarbonisation", "Policy, economics & governance", "Sustainability assessment & indicators", "Urban nature & green infrastructure", "Water & aquatic systems"], "original_keywords": ["co2", "environmental footprints", "green infrastructures", "trade", "water use"], "raw_keywords": ["capital", "co2", "drivers", "environmental footprint", "green infrastructures", "trade", "water use"], "cml_themes": ["Urban", "Water", "Resources"], "cml_scores": {"Biodiversity": 0.4, "Resources": 1.4, "Urban": 3.2, "Water": 2.8}}, {"name": "Hauke Ward", "title": "Assistant professor", "keywords": ["energy and climate economics", "impact assessment of environmental policies", "industrial ecology", "input-output analysis", "sustainable development"], "tags": ["Assistant professor", "energy and climate economics", "impact assessment of environmental policies", "industrial ecology", "input-output analysis", "sustainable development"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Hauke Ward is an assistant professor of industrial ecology. His current research predominantly focusses on distributional impacts of more ambitious climate policies, responsibility accounting for emissions embodied in trade and the role of industrial technology for current and future emissions. Since October 2019 Hauke is an assistant professor at CML. From December 2017-2019 he was working as a postdoc at the Mercator Research Institute on Global Commons and Climate Change (MCC) Berlin. He has an interdisciplinary background which is reflected in his educational qualifications. Hauke holds a PhD in economics (TU Berlin) and a B.Sc. and M.Sc. in mathematics (University of Göttingen). From 2012-2016 he was a member of the interdisciplinary Collaborative Research Centre (CRC) 1026 “Sustainable Manufacturing” of the Deutsche Forschungsgesellschaft (DFG) Hauke’s research hovers at the interface of environmental and energy economics, industrial ecology and climate policy. It is primarily based on highly resolved economic network data (multi-regional input-output data). Hauke is predominantly interested in global supply chain networks, economic and industrial sustainability, the role of energy within economic processes and the role that differences in technology play with regard to current and future emissions. For an overview of the publications of Hauke's work before CML, please follow this link.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/w/ward-hauke.png/ward-hauke.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/hauke-ward", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Policy, economics & governance", "Climate, energy & decarbonisation", "Input-output analysis & footprints", "Sustainability assessment & indicators"], "original_keywords": ["energy and climate economics", "impact assessment of environmental policies", "input-output analysis"], "raw_keywords": ["energy and climate economics", "impact assessment of environmental policies", "industrial ecology", "input-output analysis", "sustainable development"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 1.4}}], "environmental_biology": [{"name": "Henrik Barmentlo", "title": "Assistant professor", "keywords": ["agrochemicals", "aquatic invertebrates", "artificial fertilizer", "communities", "community ecology", "ecosystem functioning", "ecotoxicology", "insect decline", "insecticides", "mesocosm", "neonicotinoids", "pesticides", "risk assessment"], "tags": ["Assistant professor", "agrochemicals", "aquatic invertebrates", "artificial fertilizer", "communities", "community ecology", "ecosystem functioning", "ecotoxicology", "insect decline", "insecticides", "mesocosm", "neonicotinoids", "pesticides", "risk assessment"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Henrik is an ecologist and ecotoxicologist focusing on identifying how pollution moves through and impacts ecosystems. Since late 2022, Henrik is an Assistant Professor at CML – Environmental Biology. Henrik explores the spread and effects of pollution in and on ecosystems. His work does not entail one specific ecosystem, but there is a profound interest in the freshwater ecosystem. Similarly, his work also does not necessarily focus on specific species or organism groups, but he specializes in macroinvertebrates such as insects. For example, in the Horizon project Terrachem he researches what impacts chemicals can have on functional diversity and ecosystem services. Henrik is also lead of the Water Program that focusses on researching water quality and developing methods of investigating water quality. If you have inquiries about the CML Water Program or want come in contact with its researchers, you can contact him directly or via the CML office management. Henrik received his BSc degree in Biology in 2013 and MSc degree in Biological Sciences (Cum Laude) in 2015 at the University of Amsterdam. He performed internships on 1) PFAS ecotoxicity in daphnids, 2) Genomics in endangered Primroses and 3) effects of climate change on metal(loid) toxicity to soil dwelling enchytraeids. During this time, Henrik specialized in Ecology, Evolution and Ecotoxicology. Henrik completed his PhD research at the Environmental Biology department of CML in 2020. During this time, he and CML colleagues worked in the outdoor research facility the Living Lab where he researched the effects that pesticides can have on natural invertebrate communities and their roles in ecosystem functionality. From 202o to 2022, Henrik was a postdoctoral researcher at the University of Amsterdam working on nitrogen deposition originating from dairy farms using various techniques such biomonitoring, flux chamber techniques and stable isotopes. Henrik’s research is focused on describing, quantifying the influence of environmental pollution in the environment. He has a keen interest in chemicals coming from agriculture, but also work on other forms of environmental stress such nitrogen and light pollution. His overall aim is to distinguish the effects of chemical stressors from all other abiotic and biotic factors that occur in the field so that the risks of chemical to natural ecosystems can be identified. For this he uses a combination of both field and statistical techniques. Henrik teaches in several courses of both the Biology programs and the MSc program Governance of Sustainability. He coordinates the courses Veldonderzoek Milieubiologie and Water and Toxicity. He is also a member of the Governance of Sustainability program committee.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/b/barmentlo-henrik-cml.jpg/barmentlo-henrik-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/henrik-barmentlo", "field": "environmental_biology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Ecotoxicology & chemical pollution", "Biodiversity & community ecology", "Conservation, invasion & resilience", "Nutrients & biogeochemical cycles", "Water & aquatic systems"], "original_keywords": ["pesticides", "aquatic invertebrates", "artificial fertilizer", "community ecology", "ecosystem functioning", "ecotoxicology", "insect decline", "mesocosm", "risk assessment"], "raw_keywords": ["agrochemicals", "aquatic invertebrates", "artificial fertilizer", "communities", "community ecology", "ecosystem functioning", "ecotoxicology", "insect decline", "insecticides", "mesocosm", "neonicotinoids", "pesticides", "risk assessment"], "cml_themes": ["Water", "Biodiversity", "Future food"], "cml_scores": {"Biodiversity": 4.0, "Future food": 2.9, "Resources": 0.4, "Water": 4.3}}, {"name": "Koos Biesmeijer", "title": "Professor Natural Capital", "keywords": [], "tags": ["Professor Natural Capital"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/b/koos_biesmeijer_200_250.jpg/koos_biesmeijer_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/koos-biesmeijer", "field": "environmental_biology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Ecosystem services & nature-based solutions"], "original_keywords": [], "raw_keywords": [], "cml_themes": ["Biodiversity"], "cml_scores": {"Biodiversity": 0.7, "Urban": 0.2}}, {"name": "Peter van Bodegom", "title": "Professor Environmental biology and Circular Horticultural Systems", "keywords": ["biogeography", "ecosystem functioning", "ecosystem services", "global vegetation modelling", "plant soil interactions", "trait based approaches"], "tags": ["Professor Environmental biology and Circular Horticultural Systems", "biogeography", "ecosystem functioning", "ecosystem services", "global vegetation modelling", "plant soil interactions", "trait based approaches"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Environmental Biology"], "summary": "Prof.dr.ir. van Bodegom is professor Environmental Biology and professor Circular International Horticulture Systems within the Institute of Environmental Sciences. He investigates biodiversity and ecosystem patterns to support transitions to a sustainable society. Prof. van Bodegom is professor Environmental Biology and professor Circular International Horticulture Systems at the Institute of Environmental Sciences, Leiden University. He investigates the mutual dependencies between nature and society. He addresses urgent challenges in understanding the impacts of human influences on nature and biodiversity and the needs of society for nature through natural capital and ecosystem services. By developing state-of-the-art tools from molecular ecology (for environmental DNA), remote sensing (in data assimilation systems) and data science (for global databases and analyses, e.g. on traits-based approaches or functional diversity patterns), nature and biodiversity patterns are assessed at unprecedented accuracy and resolution. In inter- and transdisciplinary national and international teams, he contributes to sustainable solutions towards creating a resilient livelihood. His focus therein is on quantifying the natural mechanisms involved, the connections to society and their trade-offs and synergies at spatiotemporal scales. Through his work, he stimulates creating new visions on our landscape, advising provinces, water boards, national governments and European organisations. Peter has always enjoyed working at the interface of scientific fields. He graduated in soil science at Wageningen University in 1995. In 2000, he received his PhD, at Wageningen University, working at the interface of microbiology and plant ecophysiology modelling (cum laude; top 3%). He subsequently worked as postdoc, tenure tracker, assistant and associate professor at the department of Systems Ecology of the VU University Amsterdam, connecting ecology to climate and global change modelling. In 2015, he moved to Leiden University to fulfil the current position. Peter published more than 200 peer-reviewed papers including publications in leading journals like Nature, PNAS, Nature Ecology Evolution and Ecology Letters and has been key note speaker on various conferences. For an overview of the publications of Peter before he worked at CML, please follow this link.", "projects": [{"title": "C-SCAPE - Sandy strategies for sustainable coastal climate change adaptation", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-c-scape---sandy-strategies-for-sustainable-coastal-climate-change-adaptation"}, {"title": "Bamboo", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-bamboo"}, {"title": "COMBINED - increasing biodiversity and climate change resilience in Dutch landscapes", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-combined---increasing-biodiversity-and-climate-change-resilience-in-dutch-landscapes"}, {"title": "Tweerichtingsverkeer tussen mens en biodiversiteit", "url": "https://www.universiteitleiden.nl/en/research/research-output/science/tweerichtingsverkeer-tussen-mens-en-biodiversiteit"}, {"title": "Global Soil Biodiversity Atlas", "url": "https://www.universiteitleiden.nl/en/research/research-output/science/cml-global-soil-biodiversity-atlas"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/b/peter_van_bodegom_200_250.jpg/peter_van_bodegom_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/peter-van-bodegom", "field": "environmental_biology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Biodiversity & community ecology", "Plant & vegetation ecology", "Ecosystem services & nature-based solutions", "Modelling, scenarios & integrated assessment", "Soil, fungi & microbes"], "original_keywords": ["biogeography", "ecosystem functioning", "ecosystem services", "global vegetation modelling", "plant soil interactions", "trait based approaches"], "raw_keywords": ["biogeography", "ecosystem functioning", "ecosystem services", "global vegetation modelling", "plant soil interactions", "trait based approaches"], "cml_themes": ["Biodiversity", "Future food"], "cml_scores": {"Biodiversity": 5.3, "Future food": 1.2, "Resources": 1.2, "Urban": 0.2, "Water": 0.4}}, {"name": "Jan Boersema", "title": "Professor of Fundamentals of environmental sciences", "keywords": ["curriculum", "environmental philosophy", "environmental sciences", "principles of environmental sciences", "sustainability and religion"], "tags": ["Professor of Fundamentals of environmental sciences", "curriculum", "environmental philosophy", "environmental sciences", "principles of environmental sciences", "sustainability and religion"], "organisation": ["Science", "Institute of Environmental Sciences (CML)"], "summary": "Jan Boersema's current research is focused on the relation between sustainability, nature, culture, worldviews and religion. He is also Confidential Counselor for PhD students of the Graduate School of the Faculty of Science. He got his academic training as a biologist, major ethology, at the University of Groningen and lectured on biology and environmental sciences at the same University. He graduated in theology at on a thesis titled: The Torah and the Stoics on Humankind and Nature (Brill, Leiden, 2001). In 1994 he became Reader in Environmental Science and Philosophy at Leiden University and at the same time Secretary General of the Council for the Environment. At the same ministry he became a cofounder and member of Forum a think-tank operating from 1999 - 2002. In 2002 he was appointed as professor, at the VU where he was based at the IVM (Institute for Environmental Studies) His inaugural lecture entitled Hoe Groen is het Goede Leven (How Green is the Good Life) in which he developed a new theory on the ecological history of Easter Island was held in October 2002. His current research is focused on the relation between sustainability, nature, culture, worldviews and religion. Running title “How Green is Progress? His publications cover a wide range of subjects in the environmental field. With Wim Zweers he edited Ecology, Technology and Culture (White Horse Press, Cambridge 1994). His latest book is on the ecological history of Easter Island ( Beelden van Paaseiland, Atlas Amsterdam 2011) ( The Changing Faces of Easter Island: On Dwindling Resources and Cultural Resilience. Cambridge University Press, Cambridge 2014). He is editor in chief of two textbooks on Environmental Science: Basisboek Milieukunde (Boom, Amsterdam 1984, 1992) and Principles of Environmental Sciences (Springer Publishers, 2009). In 2003 he was appointed Editor in Chief of the Journal of Integrative Environmental Sciences. In 2009-2010 he was elected visiting fellow at St Edmunds College, University of Cambridge UK. January 1th 2013 he was appointed part time research professor at the A. Kuyper Centre for Science and Religion at the VU. In 2014 he became professor 'Principles of Environmental Sciences' at the Institute for Environmental Sciences, Leiden University. J.J. Boersema (1973) Agressive Behaviour in C57 BL. Mice. Paper presented at the 15th Ethological Congress, Washington D.C. W.L. Buitelaar & J.J. Boersema (1976) De rol van aktiegroepen en aktieonderzoek. Milieukundig Studiecentrum, RuG, Groningen. Boersema (1977) Muizen en getallen. In P.R. Wiepkema & J.A.R.A.M. van Hooff (red.) Agressief gedrag, oorzaken en functies. Bohn, Scheltema & Holkema, Utrecht, 45-69. Boersema (1977) De rechtbank als ethologisch gebeuren. Nederlands Tijdschrift voor Criminologie 19/2, 87-101. Ed. Leuw, J.J. Boersema & J.J.M. van Dijk (1977) Een nieuwe benadering in de criminologie? Nederlands Tijdschrift voor Criminologie 19/5, 229-244. Boersema (1977) De advocaat als vreemde vogel. In: Beeld en Tegenbeeld van de advocatuur. Jubileumnummer van het Advocatenblad 57ste jrg, 13-21. Boersema & A.P.P. Verhoeven (1978) Hoe rationeel beslist de mens? Boersema, A. Nentjes, L. Reijnders & A. van der Veen (1978) Milieuhygiënische consequenties van industriële ontwikkeling rond het Eems-Dollard estuarium, deel IIIB. Boersema & L. Reijnders (1978/1985) Overzicht van theorieën die de milieuproblematiek proberen te verklaren. IVEM / RuG, Groningen. Boersema (1979) 10 jaar Club van Rome. Enkele algemene aspecten. Boersema (1980) Kunnen wei
