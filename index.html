<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>Institute of Environmental Sciences CML, Leiden University - Theme search dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ie:#d9730d; --eb:#1f8a4c; --bg:#f5f6f8; --card:#fff; --line:#dde1e6; --ink:#1d2430; --mute:#6b7685; --accent:#2457c5; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  header .stats { color:var(--mute); }
  .hbtns { margin-left:auto; display:flex; gap:6px; }
  .btn { display:inline-flex; align-items:center; gap:6px; }
  main { position:relative; flex:1; min-height:0; display:grid; grid-template-columns:290px minmax(0,1fr) 360px; }
  aside, section { overflow:auto; padding:12px; min-height:0; }
  body.hide-filters main { grid-template-columns:0 minmax(0,1fr) 360px; }
  body.hide-people main { grid-template-columns:290px minmax(0,1fr) 0; }
  body.hide-filters.hide-people main { grid-template-columns:0 minmax(0,1fr) 0; }
  body.hide-filters aside.filters, body.hide-people aside.people { padding:0; border:0; overflow:hidden; visibility:hidden; }
  .edgetab { position:absolute; top:50%; transform:translateY(-50%); z-index:6; width:16px; height:64px; padding:0; border:1px solid var(--line); background:#fff; color:var(--mute); font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .edgetab:hover { background:#eef3ff; color:var(--accent); }
  .edgetab-l { left:290px; border-left:0; border-radius:0 8px 8px 0; }
  .edgetab-r { right:360px; border-right:0; border-radius:8px 0 0 8px; }
  body.hide-filters .edgetab-l { left:0; }
  body.hide-people .edgetab-r { right:0; }
  @media (max-width:1100px) { .edgetab-l { left:260px; } body.hide-filters .edgetab-l { left:0; } .edgetab-r { display:none; } }
  @media (max-width:760px) { .edgetab { display:none; } }
  aside.filters { background:#fff; border-right:1px solid var(--line); }
  aside.people { background:#fff; border-left:1px solid var(--line); }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:16px 0 6px; display:flex; align-items:center; gap:8px; }
  h2:first-child { margin-top:0; }
  h2 .spacer { flex:1; }
  .row { display:flex; gap:6px; align-items:center; margin:3px 0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:3px 9px; cursor:pointer; font-size:12px; color:var(--mute); }
  .seg button.on { background:var(--accent); color:#fff; }
  button.link { border:0; background:none; color:var(--accent); cursor:pointer; padding:0; font-size:12px; }
  button.btn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; }
  input[type=search] { width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; }
  .list { max-height:230px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  .list label { display:flex; gap:6px; align-items:center; padding:2px 0; cursor:pointer; }
  .list label span.n { margin-left:auto; color:var(--mute); font-size:12px; }
  .list label.zero { opacity:.45; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .toolbar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .toolbar label { color:var(--mute); font-size:12px; display:flex; gap:6px; align-items:center; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; }
  #graph-wrap { height:calc(100% - 210px); min-height:340px; position:relative; }
  svg { width:100%; height:100%; display:block; }
  .edge { stroke:#9aa5b4; stroke-opacity:.35; }
  .node circle { stroke:#fff; stroke-width:1.5; cursor:pointer; }
  .node text { font-size:calc(11px * var(--inv,1)); pointer-events:none; paint-order:stroke; stroke:#fff; stroke-width:calc(3px * var(--inv,1)); }
  .node { cursor:pointer; }
  .node circle, .edge { vector-effect:non-scaling-stroke; }
  #svg { cursor:grab; touch-action:none; user-select:none; }
  #svg.panning, #svg.panning .node { cursor:grabbing; }
  .zoomctl { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:4px; }
  .zoomctl { z-index:3; }
  .zoomctl button { width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:18px; font-weight:500; line-height:1; color:var(--ink, #222); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .zoomctl button#zfit { font-size:12px; font-weight:600; }
  .zoomctl button:hover { background:#eef3ff; }
  #emptyMsg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:var(--mute); pointer-events:none; }
  mark { background:#fff3c4; padding:0 1px; border-radius:2px; }
  .snippet { font-size:12px; color:var(--mute); margin-top:3px; }
  .splitbar { display:flex; height:5px; border-radius:3px; overflow:hidden; margin-top:5px; background:#e8ebef; }
  .splitbar i { display:block; height:100%; }
  #clusterBox { margin-top:10px; padding:8px 10px; }
  #clusterBox summary { cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
  #clusterBox[open] summary { margin-bottom:8px; }
  .legendbar { margin-top:6px; font-size:12px; }
  .legendbar:empty { display:none; }
  .node.dim { opacity:.15; }
  .node.sel circle { stroke:#111; stroke-width:3; }
  .edge.dim { stroke-opacity:.05; }
  #clusters { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; max-height:190px; overflow:auto; }
  .cluster { padding:8px; cursor:pointer; border-left-width:5px; border-left-style:solid; }
  .cluster:hover, .cluster.sel { background:#eef3ff; }
  .cluster b { display:block; margin-bottom:2px; }
  .cluster small { color:var(--mute); }
  .person { display:flex; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .person img { width:48px; height:60px; object-fit:cover; border-radius:6px; background:#e8ebef; flex:none; }
  .person .name { font-weight:600; }
  .person .name a { color:inherit; text-decoration:none; }
  .person .name a:hover { text-decoration:underline; }
  .badge { font-size:11px; padding:1px 6px; border-radius:10px; color:#fff; margin-left:6px; vertical-align:1px; }
  .chip { display:inline-block; font-size:11px; padding:1px 7px; margin:2px 3px 0 0; border-radius:10px; background:#eef1f5; cursor:pointer; border:1px solid transparent; }
  .chip:hover { border-color:var(--accent); }
  .chip.theme { background:#e7efff; }
  .chip.hit { background:#fff3c4; }
  .chip.active { background:var(--accent); color:#fff; }
  .mute { color:var(--mute); }
  .focus-bar { background:#fff8dc; border:1px solid #f0dc8a; border-radius:6px; padding:6px 8px; margin-bottom:8px; display:flex; gap:8px; align-items:center; }
  .tip { position:fixed; pointer-events:none; background:#1d2430; color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; display:none; max-width:280px; z-index:5; }
  #filterToggle { display:none; }
  @media (max-width:1100px) { body.hide-filters main { grid-template-columns:0 1fr; } body.hide-people aside.people { display:none; } }
  .sheet-head, #filterFab { display:none; }
  .sheet-head { position:sticky; top:0; z-index:2; background:#fff; padding:12px 0; margin-bottom:4px; border-bottom:1px solid var(--line); align-items:center; gap:10px; }
  .sheet-head b { font-size:16px; flex:1; }
  .sheet-head .btn.primary, #filterFab { background:var(--accent); color:#fff; border-color:var(--accent); }
  #filterFab { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:20; padding:12px 22px; border-radius:24px; box-shadow:0 4px 14px rgba(0,0,0,.3); font-size:15px; font-weight:600; align-items:center; gap:8px; cursor:pointer; border:0; }
  @media (max-width:1100px) { body { height:auto; min-height:100vh; } main { grid-template-columns:260px 1fr; } aside, section { overflow:visible; } aside.people { grid-column:1 / -1; border-left:0; } #graph-wrap { height:480px; } #clusters { max-height:none; } }
    @media (max-width:760px) {
    body { font-size:15px; }
    header { padding:8px 12px; gap:6px 10px; position:sticky; top:0; z-index:10; }
    header h1 { font-size:14px; flex:1 1 100%; }
    header button { margin-left:0; }
    main { display:flex; flex-direction:column; }
    aside, section { padding:10px; }
    aside.filters { position:fixed; inset:0; z-index:30; overflow:auto; border-right:0; display:none; padding:0 14px 90px; }
    body.show-filters aside.filters { display:block; }
    body.show-filters { overflow:hidden; }
    .sheet-head { display:flex !important; }
    #filterFab { display:flex; }
    .list { max-height:240px; }
    section { order:1; }
    aside.people { order:3; border-left:0; border-top:1px solid var(--line); }
    .list, .list.tall { max-height:200px; }
    .list label { padding:6px 0; }
    .list input[type=checkbox], #dept input { width:18px; height:18px; }
    .seg button { padding:7px 12px; font-size:13px; }
    .toolbar { gap:8px 12px; }
    .toolbar input[type=range] { width:110px; }
    #legend { display:none; }
    #graph-wrap { height:auto; min-height:0; aspect-ratio:560 / 860; }
    .node text { font-size:calc(15px * var(--inv,1)); }
    #svg { touch-action:pan-y; }
    #clusters { grid-template-columns:1fr; max-height:none; }
    .cluster { padding:10px; }
    .person img { width:56px; height:70px; }
    .chip { font-size:12px; padding:3px 9px; }
  }
  .ico { flex:none; vertical-align:-3px; display:inline-block; }
  .legendbar .lgrow { display:flex; flex-wrap:wrap; align-items:center; gap:4px 16px; }
  .legendbar .lg { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  header h1 { display:flex; align-items:center; gap:8px; }
  header h1 .ico { color:var(--accent); }
  #cmlPills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { --c:#888; display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); background:#fff; border-radius:14px; padding:2px 8px 2px 6px; cursor:pointer; font-size:12px; color:var(--ink); }
  .pill .ico { color:var(--c); }
  .pill b { font-weight:600; font-size:10px; color:var(--mute); }
  .pill:hover { border-color:var(--c); }
  .pill.on { background:var(--c); border-color:var(--c); color:#fff; }
  .pill.on .ico, .pill.on b { color:#fff; }
  .pill.zero { opacity:.45; }
  .cmlbadge { display:inline-flex; margin-left:5px; vertical-align:-3px; }
  #activeFilters { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  #activeFilters:empty { display:none; }
  #activeFilters .chip { background:var(--accent); color:#fff; padding:2px 9px; }
  #card { position:absolute; left:10px; top:10px; width:min(310px, calc(100% - 20px)); max-height:calc(100% - 20px); overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:12px; z-index:5; font-size:12.5px; }
  #card[hidden] { display:none; }
  #card .chead { display:flex; gap:10px; align-items:flex-start; }
  #card img { width:56px; height:70px; object-fit:cover; border-radius:6px; background:#eee; flex:none; }
  #card svg.ico { position:static; inset:auto; width:12px; height:12px; }
  #card h3 { margin:0 0 2px; font-size:15px; }
  #card .sub { color:var(--mute); }
  #card .cx { margin-left:auto; border:0; background:none; cursor:pointer; font-size:18px; line-height:1; color:var(--mute); }
  #card h4 { margin:10px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
  #card .row { display:flex; flex-wrap:wrap; gap:4px; }
  #card .bio { margin:8px 0 0; line-height:1.4; }
  .halo { pointer-events:none; }
  .halo-label { pointer-events:all; cursor:pointer; }
  .halo-label:hover text, .halo-label.hot text { text-decoration:underline; }
  .halo-label text { font-size:13px; font-weight:600; paint-order:stroke; stroke:#fff; stroke-width:3px; }
  details.bio { margin-top:4px; font-size:12px; }
  details.bio summary { cursor:pointer; color:var(--accent); }
  details.bio p { margin:4px 0 0; color:var(--mute); max-height:200px; overflow:auto; }
  details.facet { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  details.facet summary { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); cursor:pointer; }
  details.facet summary .sel { color:var(--accent); text-transform:none; letter-spacing:0; }
  details.facet[open] summary { margin-bottom:8px; }
  .opts { position:relative; margin-left:auto; }
  .opts summary { cursor:pointer; font-size:12px; color:var(--mute); padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; list-style:none; }
  .opts summary::-webkit-details-marker { display:none; }
  .opts[open] summary { color:var(--ink); border-color:var(--accent); }
  .optsbody { position:absolute; right:0; top:calc(100% + 4px); z-index:6; min-width:230px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; box-shadow:0 6px 18px rgba(0,0,0,.14); display:flex; flex-direction:column; gap:8px; }
  .optsbody label { justify-content:space-between; }
  @media (min-width:1101px) {
    section { display:flex; flex-direction:column; }
    section > * { flex:none; }
    section > #graph-wrap { flex:1; height:auto; min-height:340px; }
    #graph-wrap svg { position:absolute; inset:0; }
  }
  body[data-view=people] .needs-items, body[data-group=cml] .needs-clusters { display:none; }
  .person.hl { background:#fffbe6; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .node:focus-visible { outline:none; }
  .node:focus-visible circle { stroke:#111; stroke-width:3; }
  .kbd { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 4px; color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1><span data-ico="network" data-size="20"></span>Institute of Environmental Sciences CML, Leiden University - Theme search dashboard</h1>
  <span class="stats" id="stats"></span>
  <div class="hbtns"><button class="btn" id="share" title="Copy a link to this exact view"><span data-ico="link"></span><span id="shareTxt">Copy link</span></button></div>
</header>
<main>
  <button class="edgetab edgetab-l" id="edgeFilters" aria-pressed="true" aria-label="Hide filter panel" title="Hide / show the filter panel">‹</button>
  <button class="edgetab edgetab-r" id="edgePeople" aria-pressed="true" aria-label="Hide people list" title="Hide / show the people list">›</button>
  <aside class="filters" id="filters">
    <div class="sheet-head"><b>Filters</b><button class="btn" id="sheetReset">Reset</button><button class="btn primary" id="sheetDone">Show results</button></div>
    <h2>Search people</h2>
    <input type="search" id="q" placeholder="Name, topic, anything in the bio…  ( / )" autocomplete="off">
    <h2>CML research theme</h2>
    <div id="cmlPills"></div>
    <h2>Department</h2>
    <div id="dept"></div>

    <details class="facet" id="tagBox">
      <summary>Harmonized tags <span class="sel" id="tagSel"></span></summary>
      <div class="row"><span class="mute">Match</span>
        <span class="seg" id="tagMode"><button data-m="any" class="on" title="Person has at least one selected tag">any</button><button data-m="all" title="Person has all selected tags">all</button></span>
        <span class="spacer" style="flex:1"></span><button class="link" data-clear="tag">clear</button></div>
      <input type="search" id="tagSearch" placeholder="Search tags…">
      <div class="list" id="tagList"></div>
    </details>

    <details class="facet" id="kwBox">
      <summary>Original keywords <span class="sel" id="kwSel"></span></summary>
      <div class="row"><span class="mute">Match</span>
        <span class="seg" id="kwMode"><button data-m="any" class="on" title="Person has at least one selected keyword">any</button><button data-m="all" title="Person has all selected keywords">all</button></span>
        <span class="spacer" style="flex:1"></span><button class="link" data-clear="kw">clear</button></div>
      <input type="search" id="kwSearch" placeholder="Search keywords…">
      <div class="list" id="kwList"></div>
    </details>
  </aside>

  <section>
    <div class="toolbar">
      <label>Group by
      <span class="seg" id="colorBy" title="How people are grouped on the map">
        <button data-c="cml" class="on" title="The institute's five research themes">CML themes</button>
        <button data-c="field" title="Clusters of people who study similar topics (harmonized tags + keywords)">Field cluster</button>
        <button data-c="method" title="Clusters of people who use similar methods">Method cluster</button>
      </span></label>
      <details class="opts"><summary>Display options</summary>
        <div class="optsbody">
          <label class="needs-items">Min. people per node
            <span><input type="range" id="minCount" min="1" max="6" value="1"> <b id="minCountVal">1</b></span>
          </label>
          <label class="needs-clusters">Cluster detail
            <span><input type="range" id="resolution" min="0.5" max="4" step="0.25" value="2"> <b id="resolutionVal">2</b></span>
          </label>
          <label><span>Show all labels</span> <input type="checkbox" id="allLabels"></label>
        </div>
      </details>
      <button class="btn" id="reset" title="Clear all filters and selections"><span data-ico="reset"></span>Reset all</button>
    </div>
    <div id="activeFilters"></div>
    <div id="graph-wrap" class="panel">
      <svg id="svg" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"><g id="vp"><g id="halos"></g><g id="edges"></g><g id="nodes"></g></g></svg>
      <aside id="card" hidden aria-live="polite"></aside>
      <div id="emptyMsg">No items for the current filters</div>
      <div class="zoomctl"><button class="btn" id="zin" title="Zoom in" aria-label="Zoom in">+</button><button class="btn" id="zout" title="Zoom out" aria-label="Zoom out">−</button><button class="btn" id="zfit" title="Fit to view">Fit</button></div>
    </div>
    <div class="legendbar mute" id="legend"></div>
    <details id="clusterBox" class="panel"><summary id="clusterSum">Clusters</summary><div id="clusters"></div></details>
  </section>

  <aside class="people">
    <h2>People <span class="mute" id="peopleCount"></span></h2>
    <div id="focusBar"></div>
    <div id="people"></div>
  </aside>
</main>
<button id="filterFab" type="button">Filters</button>
<div class="tip" id="tip"></div>

<script>
const DATA = {"industrial_ecology": [{"name": "Valerio Barbarossa", "title": "Assistant professor", "keywords": ["freshwater biodiversity", "gis", "global hydrology", "impact assessment", "integrated assessment", "lca", "water quality"], "tags": ["Assistant professor", "freshwater biodiversity", "gis", "global hydrology", "impact assessment", "integrated assessment", "lca", "water quality"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Valerio is Assistant Professor of Industrial Ecology at the institute of Environmental Sciences (CML) since February 2020. Prior to joining CML, Valerio worked at PBL Netherlands Environmental Assessment Agency in The Hague, where he currently maintains a partial appointment. At PBL, he is responsible for further developing the freshwater part of the policy-support biodiversity assessment model IMAGE-GLOBIO. Valerio holds a PhD in Environmental Science from Radboud University, where he worked on establishing large-scale hydrological and ecological numerical models for global environmental sustainability assessments. Valerio has also enjoyed a global career in both industry and academia. He worked one and a half years at Unilever R&D in the UK and spent time as a visiting scholar at Stanford University’s Natural Capital Project. Valerio’s research interest revolves around understanding environmental trade-offs of renewables in the face of the energy transition. He is currently working on assessing environmental and biodiversity impacts of hydropower and mining. In his work, Valerio uses a mix of data-science and spatial analysis techniques. His research has appeared in high-profile journals, such as Proceedings of the National Academy of Sciences and has featured in Dutch newspapers such as de Volkskrant and other international media. For an overview of the publications of Valerio's work before CML, please follow this link.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/b/barbarossa-valerio-cml.jpg/barbarossa-valerio-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/valerio-barbarossa", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Water & aquatic systems", "Modelling, scenarios & integrated assessment", "Sustainability assessment & indicators", "Biodiversity & community ecology", "Earth system & global change", "Life cycle assessment"], "original_keywords": ["freshwater biodiversity", "gis", "global hydrology", "impact assessment", "integrated assessment models", "life cycle assessment", "water quality"], "raw_keywords": ["freshwater biodiversity", "gis", "global hydrology", "impact assessment", "integrated assessment", "lca", "water quality"], "cml_themes": ["Water", "Biodiversity", "Resources"], "cml_scores": {"Biodiversity": 2.2, "Resources": 1.0, "Water": 2.8}}, {"name": "Peter Berrill", "title": "Assistant professor", "keywords": ["buildings", "decarbonisation", "environmental footprints", "material flow analysis (mfa)", "sufficiency", "transport", "urban design"], "tags": ["Assistant professor", "buildings", "decarbonisation", "environmental footprints", "material flow analysis (mfa)", "sufficiency", "transport", "urban design"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Peter Berrill is an industrial ecologist who seeks to understand and assess environmental impacts and opportunities for their reduction at multiple scales. His research focuses on buildings, transport, and energy sectors, and employs a variety of methods and tools including material flow and stock analysis, life cycle assessment, environmental input-output analysis, geospatial analysis, and machine learning and other statistical models. Prior to joining CML, Peter was a post-doctoral researcher at TU Berlin, where he was funded by a Marie Skłodowska-Curie Actions Individual Fellowship to study the integrated analysis of energy and emissions from buildings and transport, considering their mutual dependence on urban form. He was a contributing author to the Buildings chapter of the IPCCs 6th Assessment Report. He has been an active member of the International Society of Industrial Ecology since 2016. Peter obtained his Ph.D. from Yale School of the Environment, where his dissertation focused on decarbonization pathways for the residential sector in the US. Before his doctoral studies he earned a M.Sc in the Erasmus Mundus Master of Industrial Ecology (MIND), which enabled him to study in TU Delft and Leiden University, Waseda University (Japan), and NTNU (Norway). He has a B.Eng. in Energy Systems Engineering from University of Galway in Ireland. Peter's research focuses on anthropogenic resource use and contributions to climate change, primarily in the buildings, transport, and energy sectors. His broad methodological expertise enables selecting and combining approaches suitable for different research questions. Major themes in Peter’s research include:", "projects": [{"title": "Circular Economy Modelling for Climate Change Mitigation (CIRCOMOD)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-economy-modelling-for-climate-change-mitigation-circomod"}, {"title": "SCRREEN3", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/scrreen3"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/b/peter-berril.jpg/peter-berril.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/peter-berrill", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Built environment & mobility", "Climate, energy & decarbonisation", "Input-output analysis & footprints", "Material & substance flow analysis", "Sustainability assessment & indicators", "Wellbeing, sufficiency & post-growth"], "original_keywords": ["buildings", "decarbonisation", "environmental footprints", "material flow analysis", "sufficiency", "transport", "urban design"], "raw_keywords": ["buildings", "decarbonisation", "environmental footprints", "material flow analysis (mfa)", "sufficiency", "transport", "urban design"], "cml_themes": ["Urban", "Resources"], "cml_scores": {"Resources": 3.2, "Urban": 5.5}}, {"name": "Marco Cinelli", "title": "Assistant Professor", "keywords": ["decision support systems", "decision-making", "environment", "policy-making", "resilience", "sustainability"], "tags": ["Assistant Professor", "decision support systems", "decision-making", "environment", "policy-making", "resilience", "sustainability"], "organisation": ["Governance and Global Affairs", "Leiden University College The Hague", "Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Marco Cinelli is an Assistant Professor at Leiden University College (LUC) in The Hague and at the Institute of Environmental Sciences (CML) of Leiden University. His research focuses on the development of tools to support decision-making for complex problems with multiple stakeholders and conflicting interests. The key drivers of his work are the frameworks and methodologies that can be used to guarantee a sustainable and resilient future for the generations to come. He leads the interdisciplinary initiative Decision Engineering for Sustainability and Resilience (DESIRE). The DESIRE initiative aims at: His research is focused on the development of Decision Support Systems (DSS) with Multiple Criteria Decision Analysis (MCDA). The main frameworks he uses include sustainability, resilience and risk assessment, while the main application areas are energy systems and technologies assessment, materials and processes development, and chemical safety. He is the primary developer of the MCDA Methods Selection Software (MCDA-MSS) which is the most comprehensive software for supporting complex decision-making and for recommending MCDA methods. In addition, he (co-)leads the development of other MCDA-based software, including the MCDA Index Tool, the Composite Indicator Analysis and Optimization tool, and the Weighting Methods Selection Software. He was Co-Chair of the Weighting Subtask of the Global Life Cycle Impact Assessment project of the Life Cycle Initiative (United Nations Environment Programme), aiming at establishing a comprehensive, consistent and global methodology to support life cycle-based environmental evaluations (2020-2025). Before joining LUC, between September 2018 and September 2021, Marco was a Marie Skłodowska-Curie Global Fellow at (i) the Laboratory for Energy Systems Analysis, Paul Scherrer Institute, Villigen PSI, Switzerland, (ii) the Center for Environmental Solutions and Emergency Response (CESER) (formerly National Risk Management Research Laboratory (NRMRL)) of the U.S. Environmental Protection Agency in Cincinnati, USA and (iii) the Institute of Computing Science at Poznan University of Technology, Poland. Between April 2017 and August 2018, he was a postdoctoral researcher at the Future Resilient Systems (FRS) Programme of Singapore-ETH Centre in Singapore. Prior to this, he was an early career fellow at the Intstitute of Advanced Study and research assistant in the Sustainable Materials and Manufacturing Group of WMG Department, University of Warwick (UK). He also held, between May 2016 and February 2017, a visiting scientist position at the Joint Research Centre of the European Commission in Ispra (VA), Italy. Marco received his Ph.D. in Engineering from the University of Warwick (UK) in 2016.", "projects": [{"title": "How is multi-criteria decision analysis supporting existing software for nature-based solutions decisions?", "url": "https://www.universiteitleiden.nl/en/research/research-output/governance-and-global-affairs/how-is-multi-criteria-decision-analysis-supporting-existing-software-for-nature-based-solutions-decisions"}, {"title": "A composite indicator for evaluating safety and sustainability by design and circularity in emerging technologies", "url": "https://www.universiteitleiden.nl/en/research/research-output/governance-and-global-affairs/a-composite-indicator-for-evaluating-safety-and-sustainability-by-design-and-circularity-in-emerging-technologies"}, {"title": "Weighting factors for LCA - A new set from a global survey", "url": "https://www.universiteitleiden.nl/en/research/research-output/governance-and-global-affairs/weighting-factors-for-lca-a-new-set-from-a-global-survey"}, {"title": "A Framework to Navigate Eco-Labels in the Textile and Clothing Industry", "url": "https://www.universiteitleiden.nl/en/research/research-output/governance-and-global-affairs/a-framework-to-navigate-eco-labels-in-the-textile-and-clothing-industry"}, {"title": "Weighing the impacts of our goods and services on the environment and climate: how to measure?", "url": "https://www.universiteitleiden.nl/en/research/research-projects/governance-and-global-affairs/weighing-the-impacts-of-our-goods-and-services-on-the-environment-and-climate-how-to-measure"}, {"title": "ENKORE: Designing a sustainable future for the European Healthcare Sector", "url": "https://www.universiteitleiden.nl/en/research/research-projects/governance-and-global-affairs/enkore-designing-a-sustainable-future-for-the-european-healthcare-sector"}, {"title": "Lasers4MaaS", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/lasers4maas"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/campus-the-hague/unsorted/marco-cinelli_sa22311.jpg/marco-cinelli_sa22311.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/marco-cinelli", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Decision support & uncertainty", "Data science, computing & AI", "Policy, economics & governance"], "original_keywords": ["decision support", "policy-making", "resilience"], "raw_keywords": ["decision support systems", "decision-making", "environment", "policy-making", "resilience", "sustainability"], "cml_themes": ["Resources"], "cml_scores": {}}, {"name": "Stefano Cucurachi", "title": "Director of Education", "keywords": ["global sensitivity analysis", "industrial ecology", "life cycle assessment (lca)", "life cycle impact assessment (lcia)", "quantitative sustainability assessment", "uncertainty analysis", "urban studies"], "tags": ["Director of Education", "global sensitivity analysis", "industrial ecology", "life cycle assessment (lca)", "life cycle impact assessment (lcia)", "quantitative sustainability assessment", "uncertainty analysis", "urban studies"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Stefano Cucurachi is an Associate Professor of Industrial Ecology. Stefano's research focuses on Safe and Sustainable by Design (SSbD)—a transformative framework that integrates safety and sustainability considerations at the earliest stages of R&D. By embedding prospective sustainability assessment methodologies, he enables technology developers and innovators to identify and mitigate potential hazards upfront, preventing unforeseen negative consequences at scale. With a background in industrial engineering, he shifted his focus from supply chain optimization to the assessment of socio-technical systems' sustainability. Stefano obtained his PhD from Leiden University’s Faculty of Science in 2014 and pursued postdoctoral research at ETH Zurich and the Bren School of Environmental Science & Management at UC Santa Barbara. For over a decade, he has contributed to the methodological advancement of Life Cycle Assessment (LCA), from inventory and impact assessment methods to uncertainty and sensitivity analyses. Since returning to CML in 2017, his research has centered on prospective LCA, evaluating emerging technologies at the earliest stages of development to guide them toward more sustainable pathways. Currently, he is PI in several European projects applying SSbD methodologies to a variety of industries, with a focus on the pharmaceutical and chemical industries. He is spearheading the development of a computational pipeline to streamline SSbD assessments and expand the evaluation of substances of concern. He is broadening his research beyond active pharmaceutical ingredients (APIs) to assess their impact across the entire healthcare chain, from drug manufacturing to medical application and waste disposal. His work integrates LCA, Hazard Assessment (HA), and Risk Assessment (RA)—a methodological frontier that requires new analytical frameworks, robust uncertainty characterization, and innovative data structures for rapid evaluation. As the director of Education of CML, Stefano strives to innovate sustainability education and train the next generation of experts to tackle global challenges. His primary research areas include: Through his work, he aims to bridge the gap between scientific research, industrial application, and policy development, ensuring that sustainability and safety are fundamental pillars of innovation.", "projects": [{"title": "Impact assessment modelling of matter-less stressors in the context of Life Cycle Assessment", "url": "https://www.universiteitleiden.nl/en/research/research-output/science/impact-assessment-modelling-of-matter-less-stressors-in-the-context-of-life-cycle-assessment"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/c/cucurachi_stefano_4.jpg/cucurachi_stefano_4.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/stefano-cucurachi", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Decision support & uncertainty", "Life cycle assessment", "Sustainability assessment & indicators"], "original_keywords": ["uncertainty & sensitivity analysis", "life cycle assessment", "quantitative sustainability assessment", "urban studies"], "raw_keywords": ["global sensitivity analysis", "industrial ecology", "life cycle assessment (lca)", "life cycle impact assessment (lcia)", "quantitative sustainability assessment", "uncertainty analysis", "urban studies"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 1.4, "Urban": 0.6}}, {"name": "Sónia Martins da Cunha", "title": "Assistant professor", "keywords": [], "tags": ["Assistant professor"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/m/profielfoto-sonia-martins-da-cunha.png/profielfoto-sonia-martins-da-cunha.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/sonia-martins-da-cunha", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": [], "original_keywords": [], "raw_keywords": [], "cml_themes": ["Resources", "Urban"], "cml_scores": {}}, {"name": "Sebastiaan Deetman", "title": "Assistant Professor", "keywords": ["energy modeling", "industrial ecology", "life cycle assessment (lca)"], "tags": ["Assistant Professor", "energy modeling", "industrial ecology", "life cycle assessment (lca)"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Sebastiaan Deetman graduated as an Industrial Ecologist from Leiden University in 2010 and has been working as a climate policy researcher at the PBL Netherlands Environmental Assessment agency under the Responses project until end 2012. He has a broad background in sustainable chemistry, practical experience with Life Cycle Assessment (LCA) and energy modeling and is currently researching resource efficiency of critical materials under the Desire project at the CML.", "projects": [{"title": "Circular Economy Modelling for Climate Change Mitigation (CIRCOMOD)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-economy-modelling-for-climate-change-mitigation-circomod"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/d/sebastiaan_deetman_200_250.jpg/sebastiaan_deetman_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/sebastiaan-deetman", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Climate, energy & decarbonisation", "Life cycle assessment", "Modelling, scenarios & integrated assessment"], "original_keywords": ["energy modeling", "life cycle assessment"], "raw_keywords": ["energy modeling", "industrial ecology", "life cycle assessment (lca)"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 2.1}}, {"name": "Franco Donati", "title": "Assistant professor", "keywords": ["artificial intelligence", "circular economy", "data collection", "environmental input-output analysis", "life cycle inventory modelling", "reverse engineering", "scenario modelling"], "tags": ["Assistant professor", "artificial intelligence", "circular economy", "data collection", "environmental input-output analysis", "life cycle inventory modelling", "reverse engineering", "scenario modelling"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Franco Donati’s research focuses on the expansion of data availability on the environmental impacts of products and technologies, and on the development of tools and methods for circular economy scenarios analysis. He pursues these research areas by employing software and data development methods, and the use of reverse engineering for data collection practices. Specifically, he investigates data collection and generation methods for Life Cycle Inventory and Environmentally Extended Input Output databases, and software tools and methods for macro-economic sustainability scenario analysis. Franco Donati holds a PhD degree in Industrial Ecology from the Institute of Environmental Sciences of Leiden University (CML) focusing on software and data for circular economy assessment. Prior to his PhD degree, he obtained a MSc in Industrial Ecology from Leiden University and TU Delft, and a BSc in Industrial Design from the Polytechnic of Turin.", "projects": [{"title": "H2 steel", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/h2-steel"}, {"title": "Lasers4MaaS", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/lasers4maas"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/d/franco-donati.jpg/franco-donati.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/franco-donati", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Data science, computing & AI", "Circular economy & critical materials", "Input-output analysis & footprints", "Life cycle assessment", "Modelling, scenarios & integrated assessment"], "original_keywords": ["artificial intelligence", "circular economy", "data collection", "input-output analysis", "life cycle inventory", "reverse engineering", "scenario analysis"], "raw_keywords": ["artificial intelligence", "circular economy", "data collection", "environmental input-output analysis", "life cycle inventory modelling", "reverse engineering", "scenario modelling"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 3.7}}, {"name": "Tomer Fishman", "title": "Associate professor", "keywords": ["built environment", "construction materials", "dynamic modeling", "econometrics", "geographic information systems (gis)", "material stocks and flows (mfa)", "socioeconomic metabolism"], "tags": ["Associate professor", "built environment", "construction materials", "dynamic modeling", "econometrics", "geographic information systems (gis)", "material stocks and flows (mfa)", "socioeconomic metabolism"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Tomer Fishman is associate professor of industrial ecology at the institute of Environmental Sciences (CML) at Leiden University. He is interested in the sustainability questions related to the stuff we accumulate in our societies – our material stocks of products, buildings, infrastructures – questions like how do we use these resources, where do they come from and where they go after use, what are their impacts, how did they accumulate in the past and what could they look like in the future? Towards this, he develops and advances the methods of material flow and stock analysis. He has extensive international work and study experience including in Nagoya University, Japan; Hebrew University and Reichman University, Israel; and Yale University, USA. At the CML, he is the co-leader of the Institute’s Resources Research Program, and he teaches courses including the Material Flow Analysis course in the Industrial Ecology MSc program. He has been involved in supervision, advising, tutoring, and training of PhD candidates and postdocs throughout his professional career. Tomer places great emphasis on scientific networks, leading and contributing to multiple concurrent regional and international collaborations at the forefront of the field including several EU Horizon projects, reports of the United Nations Environment Program and International Resource Panel, book chapters, and many collaboratively coauthored journal articles with multiple partners across the world. He has been an active member of the International Society for Industrial Ecology ISIE) for many years, currently serving as an elected board member of the society, and formerly in roles including the co-chair of the conferences and events committee, president of the student section, and board member of the socioeconomic metabolism section. He has organized and chair international academic conferences such as the 2023 ISIE conference in Leiden. Tomer’s research is focused towards understanding the materials that accumulate in our buildings, vehicles, infrastructure, consumer products, and green technologies, and how they form the interlinkages between well-being, economic development, and the environment. This research is interdisciplinary by its nature. It combines sustainability science’s quantitative “workhorse” methods such as material flow analysis, traditionally using economic-like accounting and statistics, with innovative methods and analytical approaches from such diverse fields as geographic information systems (GIS) and remote sensing, econometrics, statistics and data analytics, and signal processing. These integrative methods expand the ways in which Tomer and his research team are able to account, model, and analyze the accumulation of material stocks and their relations to socioeconomic patterns across the world. Thus, Tomer’s research agenda expands material flow and stock analysis to answer not only which and how much materials are used, but to answer why: to what ends are they used, why does society accumulate certain types of materials, why are they amassed in certain locations and not others, and how can the strong coupling trends between material flows and development be untangled through sufficiency and efficiency. His current topics include:", "projects": [{"title": "Circular Economy Modelling for Climate Change Mitigation (CIRCOMOD)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-economy-modelling-for-climate-change-mitigation-circomod"}, {"title": "Materials-GRoWL: Gauging the Rest-of-the-World’s Lifecycles of Construction Materials", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/materials-growl-gauging-the-rest-of-the-worlds-lifecycles-of-construction-materials"}, {"title": "Mapping and assessing the construction materials required for the Belt and Road Initiative", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/mapping-and-assessing-the-construction-materials-required-for-the-belt-and-road-initiative"}, {"title": "CirCol", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-collaboration-circol-delivering-circular-renovation-at-scale-through-multi-cycle-multi-scalar-and-multi-level-collaboration"}, {"title": "Circular Circuits", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-circuits"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/f/fishman-tomer-cml.jpg/fishman-tomer-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/tomer-fishman", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Built environment & mobility", "Material & substance flow analysis", "Circular economy & critical materials", "Modelling, scenarios & integrated assessment", "Policy, economics & governance", "Spatial analysis & GIS"], "original_keywords": ["built environment", "construction materials", "dynamic modeling", "econometrics", "gis", "material flow analysis", "socioeconomic metabolism"], "raw_keywords": ["built environment", "construction materials", "dynamic modeling", "econometrics", "geographic information systems (gis)", "material stocks and flows (mfa)", "socioeconomic metabolism"], "cml_themes": ["Resources", "Urban"], "cml_scores": {"Resources": 4.2, "Urban": 5.7}}, {"name": "Jeroen Guinee", "title": "Professor Life Cycle Assessment", "keywords": ["life cycle assessment (lca)", "life cycle impact assessment (lcia)", "substance flow analysis (sfa)"], "tags": ["Professor Life Cycle Assessment", "life cycle assessment (lca)", "life cycle impact assessment (lcia)", "substance flow analysis (sfa)"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Dr. ir. Jeroen Guinée (M) has worked at the Institute of Envi­ron­mental Scie­nces (CML), Le­i­den Un­i­ve­rsi­ty since 1987, focusing on the research areas of life cycle assessment (LCA) and substance flow analysis (SFA). Prof. Jeroen Guinée (M) is a Professor of Life Cycle Assessment (LCA) at the Institute of Environmental Sciences (CML) at Leiden University in The Netherlands. He obtained his MSc in Environmental Sciences at Wageningen University and successfully defended his PhD in LCA in 1995 at Leiden University. His doctoral research focused on the development of an environmental LCA method and contributed significantly to the first LCA Guide in 1992. In 2002, he served as the project leader and editor for a seminal publication in the field of LCA, the \"Handbook on Life Cycle Assessment: Operational Guide to the ISO Standards\" which stands as one of the most respected works in this domain. He has (co-)authored over 100 scientific papers and contributed to various books. He imparts his extensive knowledge by teaching a course on LCA to second-year master's students. Additionally, he dedicates his time to supervising master and PhD students as well as Postdocs. Throughout his academic career, he has actively participated in numerous large EU-funded research consortia. In recent years, his research has been devoted to ex-ante LCA and Safe and Sustainable by Design (SSbD), aimed at supporting the development of more sustainable and innovative products and technologies.", "projects": [{"title": "TranSensusLCA", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-transensuslca"}, {"title": "Handbook on life cycle assessment", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-new-dutch-lca-guide"}, {"title": "Quantitative uncertainty in LCI", "url": "https://www.universiteitleiden.nl/en/research/research-output/science/cml-quantitative-uncertainty-in-lci"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/g/jeroen-guinee-4.jpg/jeroen-guinee-4.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/jeroen-guinee", "field": "industrial_ecology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Life cycle assessment", "Material & substance flow analysis"], "original_keywords": ["life cycle assessment", "substance flow analysis"], "raw_keywords": ["life cycle assessment (lca)", "life cycle impact assessment (lcia)", "substance flow analysis (sfa)"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 2.0}}, {"name": "Helias Udo de Haes", "title": "Professor emeritus", "keywords": ["life cycle assessment (lca)"], "tags": ["Professor emeritus", "life cycle assessment (lca)"], "organisation": ["Science", "Institute of Environmental Sciences (CML)"], "summary": "Prof. Helias A. Udo de Haes graduated in 1968 in biology at Leiden University. He performed his PhD research in the Max Planck Institut für Verhaltensphysiologie, in Seewiesen, Germany. After some years at the Technical University in Delft he joined the new department on Environmental Biology at Leiden University. In 1978 he founded CML as an interfacultary institute at the same university, of which he became the first director. In 1986 he was appointed as professor in environmental sciences. Since the beginning of the eighties research regarding the development of tools for environmental systems analysis came on the agenda of the institute, in particular Life Cycle Assessment (LCA) and Substance Flow Analysis (SFA). Personally he has been very active in the field of LCA, mainly at an international level. For many years he has been chairman of the LCA Steering Committee of SETAC-Europe. Since 1995 he has contributed to the standardization of LCA under ISO. He took the initiative for the establishment of the UNEP/SETAC Life Cycle Initiative for identifying best available practice in Life Cycle Assessment and Life Cycle Management, of which he has been the first director. In October 2006 he retired as scientific director. He is now active in the field of sustainability certification of natural resources. He is chairman of the Dutch Timber Procurement Assessment Committee and of the CEN Technical Committee 383 on biomass for energy applications.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/u/helias_udo_de_haes_200_250.jpg/helias_udo_de_haes_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/helias-udo-de-haes", "field": "industrial_ecology", "classification_basis": "keywords (no department listed): IE=12, EB=0", "rank": "Professor emeritus", "harmonized_tags": ["Life cycle assessment"], "original_keywords": ["life cycle assessment"], "raw_keywords": ["life cycle assessment (lca)"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 1.4}}, {"name": "Patrik Henriksson", "title": "Assistant professor", "keywords": [], "tags": ["Assistant professor"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Research focus on interactions between humans and the ocean, with emphasis on foods. professional experience; 2024-present Assistant Professor betweenthe Institute of Environmental Sciences, Leiden University and Stockholm Resilience Centre (Stockholm University) 2019-2024 Researcher at Stockholm Resilience Centre (Stockholm University), the Beijer Institute of Ecological Economics, and WorldFish 2015-2019 Post-doc at Stockholm Resilience Centre (Stockholm University), the Beijer Institute of Ecological Economics, and WorldFish 2010-2015: PhD thesis: Evaluating European Imports of Asian Aquaculture Products using Statistically Supported Life Cycle Assessments, Leiden University. ISBN: 978-94-6203-952-0-", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/h/profiel-foto-patrik-henriksson.jpg/profiel-foto-patrik-henriksson.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/patrik-henriksson", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Food systems", "Life cycle assessment", "Water & aquatic systems"], "original_keywords": [], "raw_keywords": [], "cml_themes": ["Future food", "Water"], "cml_scores": {"Biodiversity": 0.8, "Future food": 1.9, "Resources": 1.0, "Water": 1.6}}, {"name": "Glenn Aguilar Hernandez", "title": "Postdoc / lecturer", "keywords": ["circular economy", "environmental input-output analysis", "global south"], "tags": ["Postdoc / lecturer", "circular economy", "environmental input-output analysis", "global south"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Glenn is a researcher from Costa Rica that has developed his career in the sustainability field. He holds a bachelor degree in Chemistry from the University of Costa Rica and a master of Sustainability from the University of Sydney, Australia. He has combined experience in research and development from academic and non-academic areas in topics such as renewable energy, natural resources, and sustainability analysis. He worked as Associated Research and Bioenergy Expert in the School of Biosystems Engineering at the University of Costa Rica, where he collaborated on bioenergy projects and the Climate Change Adaptation Program. Likewise, he has experience in the development of biofuels at an industrial scale in Energias Biodegradables de Costa Rica. During his master's studies, he specialized on techniques for sustainability analysis and developed his capstone project at the Centre for Integrated Sustainability Analysis at the University of Sydney, where he contributed to the application of Multi-Regional Input-Output model in biodiversity studies. Glenn developed his PhD at CML focusing on a macro-level assessment of material circularity. This research was part of the Circular European Economy Innovative Training Network funded by European Commission under Marie Curie Actions. His research outcomes contribute to a better understanding of the environmental implications of a circular economy on a macro scale. Currently, he is working on two projects as a Postdoc. First, he is developing an assessment of the COVID-19 impacts on global supply chains, which is a collaboration with the Circular Industries Hub, Leiden-Delf-Erasmus Centre for Sustainability. Second, he is providing support to the coordination of the Work Package 3 in SCRREEN 2 Project, where he focuses on market analysis, trade, and prices of critical raw materials for the European Union.", "projects": [{"title": "UNravelling the socioeconomic and environmental Impacts of Circularity in Latin America (UNICA)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-unravelling-the-socioeconomic-and-environmental-impacts-of-circularity-in-latin-america-unica"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/h/g.a.a.-hernandez-cml-200.jpg/g.a.a.-hernandez-cml-200.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/glenn-aguilar-hernandez", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Circular economy & critical materials", "Input-output analysis & footprints", "Policy, economics & governance"], "original_keywords": ["circular economy", "input-output analysis", "global south"], "raw_keywords": ["circular economy", "environmental input-output analysis", "global south"], "cml_themes": ["Resources"], "cml_scores": {"Biodiversity": 0.4, "Resources": 3.5}}, {"name": "Rutger Hoekstra", "title": "Professor Sustainable and Inclusive Wellbeing", "keywords": ["beyond-gdp", "environmental input-output analysis"], "tags": ["Professor Sustainable and Inclusive Wellbeing", "beyond-gdp", "environmental input-output analysis"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Rutger Hoekstra is full Professor of Sustainable and Inclusive Wellbeing (Hoogleraar Brede Welvaart). He is an expert in post-growth researcher which aims to overcome societies’ focus on economic growth and profits towards Wellbeing, Inclusion and Sustainability. He leads the WISE Horizons project and is Work Package lead of the MERGE project, which both work on metrics, models, policies and narrative for sustainable and inclusive wellbeing. He was the co-chair of the UNECE/OECD/Eurostat Task Force which developed the Conference of European Statisticians Recommendations on Measuring Sustainable Development. In 2019, he published his book Replacing GDP by 2030.with Cambridge University Press. In the past, he has worked for/with the United Nations, World Bank, European Commission, OECD, European Central Bank, IMF, KPMG, Statistics Netherlands, Greenpeace, Global Reporting Initiative, Wellbeing Economy Alliance, ZOE Institute and many other organizations. Rutger Hoekstra has worked on well-being, inclusion and sustainability from an academic, governmental and business perspective. He has written two books (including) and has published numerous scientific publications on post-growth, sustainable development, globalisation, circular economy and big data applications. He was also Scientific Director of the True Value methodology at KPMG Sustainability. He currently leads the WISE Horizons project which works on metrics, models, policies and narrative for sustainable and inclusive wellbeing (brede welvaart in Dutch). Rutger’s research interest include post-growth/beyond-growth, Beyond-GDP, wellbeing/sustainability policy, inequality, environmental economics using input-output techniques, environmental accounting, structural decomposition analysis, globalisation, circular economy.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/h/foto-rutger-hoekstra.png/foto-rutger-hoekstra.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/rutger-hoekstra", "field": "industrial_ecology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Input-output analysis & footprints", "Policy, economics & governance", "Wellbeing, sufficiency & post-growth"], "original_keywords": ["beyond-gdp", "input-output analysis"], "raw_keywords": ["beyond-gdp", "environmental input-output analysis"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 1.5}}, {"name": "Mingming Hu", "title": "Associate professor", "keywords": ["concrete recycling", "construction and demolition waste management", "dynamic material flow analysis", "life cycle assessment (lca)", "life cycle costing", "life cycle sustainability analysis (lcsa)", "material flow accounting (mfa)"], "tags": ["Associate professor", "concrete recycling", "construction and demolition waste management", "dynamic material flow analysis", "life cycle assessment (lca)", "life cycle costing", "life cycle sustainability analysis (lcsa)", "material flow accounting (mfa)"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Mingming Hu applies industrial ecology methods to support the sustainable transition of the built environment. She obtained her PhD in May 2010 with the dissertation Dynamic Material Flow Analysis to Support Sustainable Built Environment Development. Her doctoral research revealed the long-term oscillation pattern of China’s construction sector, projecting a sharp decline in housing demand from around 2020 to 2050 and a sustained increase in demolition waste throughout the 21st century. These projections have proven remarkably prescient, as China has entered the “post-overbuilding era” she identified more than a decade ago. Mingming Hu is an Associate Professor in Industrial Ecology whose research applies quantitative sustainability assessment to support the transition towards carbon-neutral, circular, and climate-resilient built environment. Drawing on an interdisciplinary background in building engineering, construction management, and environmental science, she develops scientific insights and practical tools to advance sustainable urban development. Mingming obtained her PhD in Environmental Science from Leiden University in 2010 with the dissertation Dynamic Material Flow Analysis to Support Sustainable Built Environment Development: Case Studies on Chinese Housing Stock Dynamics. Prior to this, she earned an MSc in Mechanical Engineering from Chongqing Jianzhu University (China), where she specialized in ground-source heat pump systems. Before joining CML in 2006, she worked for five years at the Chongqing Construction Commission, overseeing environmental infrastructure projects. Her research integrates dynamic Material Flow Analysis (dMFA), Life Cycle Sustainability Analysis (LSCA), and spatial analysis to understand how buildings, infrastructure, materials, and urban systems evolve over time. In her doctoral research, she projected the long-term dynamics of China’s construction sector, forecasting declining housing demand and increasing demolition waste decades before these trends became evident. Mingming’s current research focuses on three interconnected themes: built environment metabolism, circular construction supply chains, and spatial opportunities for urban sustainability. Her work addresses topics such as building stock dynamics, circular construction hubs, urban green infrastructure, and resilient cities, with the aim of accelerating the transition towards resource-efficient, resilient and biodiverse urban systems. She has played a leading role in numerous European and international research projects and has contributed significantly to two decades of collaboration between CML and Chinese research partners. She currently leads projects including ReSURE2 on urban resilience, CirCol on circular collaboration in the built environment, and RAW, an EU Pathfinder project on the bio-based and circular transition of the architecture, engineering, and construction sector. Previously, she initiated and coordinated several major Sino-Dutch projects including SIP project on industrial symbiosis and energy efficiency, and the Multigreen project, which supports greener, climate-resilient cities in both countries (See video). The partnership continues through the FOREWARD project, where the Netherlands and China work jointly to improve their water systems. She also initiated a series of European Horizon projects, including ICEBERG, HISER and VEEP, on construction and demolition waste recycling, and the EU FP7 C2CA project on concrete recycling, the Asia-Link ProtEA project on dynamic material flow analysis, the Dutch InnoMan project on waste management methodologies. In addition to her work at Leiden University, Mingming supervises graduate students at Chongqing University, where she holds a visiting scientist position. Mingming Hu is working at regional metabolism, particularly related to construction. She applies MFA, dynamic MFA, LCA and LCC, alone and/or in combination, to support sustainable moves in the construction sector. In 2010, Mingming obtained her PhD degree on Environmental Science at Leiden University for the dissertation entitled Dynamic Material Flow Analysis to Support Sustainable Built Environment Development, with Case studies on Chinese Housing Stock Dynamics. She received her MSc degree on mechanical engineering from Chongqing Jianzhu University (China) for her work on ground source heat pump development. Before arriving at CML in 2006, she worked at Chongqing Construction Commission for 5 years, supervising environmental infrastructure construction. As a PhD candidate at CML, she conducted research on dynamic Material Flow Analysis (MFA) for iron and steel in Chinese residential buildings, dynamics of housing stocks in China, strategic Construction and Demolition Waste (CDW) management in Beijing. Mingming is actively involved in project acquisitions within Europe and Asia. Currently, she is the lead researcher of the H2020 HISER project (hiserproject.eu) focusing on improving the recycling of demolition waste. In addition, she is the project coordinator of the Sino-Dutch project SIP ( Smart Industrial Parks in China: towards Joint Design and Institutionalization. NWO project no. 467-14-003). The SIP project joins researchers in the Netherlands (Leiden University, Technical University of Delft) and China (Chongqing University and Tsinghua University) to reduce energy use via industrial symbiosis. Previously, she worked on EU FP7 project C2CA (c2c2.eu) on concrete recycling, EU Asia-Link project ProtEA (CN/ASIA-LINK 110-744) on dynamic MFA and Dutch CEP project InnoMan (KNAW no. 09CDP009) on waste management methodologies. Outside of CML, Mingming teaches building equipment and sustainable construction courses to undergraduate and graduate students in Chongqing University (China), where she holds an associate professor position.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/h/mingming_hu_200_250.jpg/mingming_hu_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/mingming-hu", "field": "industrial_ecology", "classification_basis": "department", "rank": "Associate professor", "harmonized_tags": ["Life cycle assessment", "Built environment & mobility", "Circular economy & critical materials", "Material & substance flow analysis", "Sustainability assessment & indicators"], "original_keywords": ["concrete recycling", "construction and demolition waste management", "material flow analysis", "life cycle assessment", "life cycle costing", "life cycle sustainability analysis"], "raw_keywords": ["concrete recycling", "construction and demolition waste management", "dynamic material flow analysis", "life cycle assessment (lca)", "life cycle costing", "life cycle sustainability analysis (lcsa)", "material flow accounting (mfa)"], "cml_themes": ["Urban", "Resources"], "cml_scores": {"Resources": 5.2, "Urban": 5.0}}, {"name": "Robert Istrate", "title": "Assistant professor", "keywords": ["critical minerals", "decarbonization", "life cycle assessment (lca)", "mathematical programming", "python", "scenario analysis", "sustainable resource management"], "tags": ["Assistant professor", "critical minerals", "decarbonization", "life cycle assessment (lca)", "mathematical programming", "python", "scenario analysis", "sustainable resource management"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Robert is an environmental engineer whose research lies at the intersection of sustainable resource management and decarbonization, assessing the environmental and economic benefits and trade-offs of natural resource use and waste valorization in industrial decarbonization. His work is grounded in the life cycle assessment (LCA) methodology and integrates other approaches such as scenario analysis, mathematical optimization, techno-economic analysis (TEA), and material flow analysis (MFA). Robert Istrate is Assistant Professor of Industrial Ecology at the Institute of Environmental Sciences (CML) of Leiden University. Prior to joining CML, he held a postdoctoral researcher position in the Department of Chemistry and Applied Biosciences at ETH Zurich (2022-2023), where he conducted research on decarbonization pathways for the chemical industry. Robert earned his PhD in Industrial Technologies from Universidad Rey Juan Carlos (Spain, 2022), focusing on the assessment and optimization of waste-to-energy strategies within the context of the circular economy. He obtained his MSc in Energy and Fuels from Universidad Autónoma de Madrid (Spain, 2018) and his BSc in Environmental Engineering from Universidad Rey Juan Carlos (Spain, 2017). Robert's current research interests include: He primarily develops these research lines within several European research projects. He coordinates work packages on the assessment of environmental impacts of raw materials supply scenarios in the RAWCLIC and HiQ-LCA projects. He also contributes to the MaDiTraCe project, exploring the integration of life cycle assessment in certification schemes for critical raw materials, and the TranSensus LCA project, where he works on harmonizing the life cycle assessment methodology for zero-emissions vehicles Beyond his research, Robert coordinates the Sustainability Area Study - The Netherlands course in the Sustainable Development Minor and the Life Cycle Assessment course offered by Leiden University College.", "projects": [{"title": "Circular Circuits", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-circular-circuits"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/main-images/science/cml/r_istrate-12.png/r_istrate-12.png/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/robert-istrate", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Circular economy & critical materials", "Modelling, scenarios & integrated assessment", "Climate, energy & decarbonisation", "Data science, computing & AI", "Life cycle assessment"], "original_keywords": ["critical raw materials", "decarbonisation", "life cycle assessment", "optimisation", "python", "scenario analysis", "sustainable resource management"], "raw_keywords": ["critical minerals", "decarbonization", "life cycle assessment (lca)", "mathematical programming", "python", "scenario analysis", "sustainable resource management"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 4.1}}, {"name": "Lena Kilian", "title": "Assistant professor", "keywords": ["consumption-based emissions", "gis", "input-output analysis"], "tags": ["Assistant professor", "consumption-based emissions", "gis", "input-output analysis"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Lena Kilian is an assistant professor at the Institute of Environmental Sciences (CML). Her work focuses on using environmentally-extended input-output analysis to estimate and analyse consumption-based emissions. Before joining Leiden University, Lena worked as a postdoctoral researcher at the University of Leeds and the Potsdam Institute for Climate Impact Research. Prior to this, Lena completed her PhD at the University of Leeds in Data Analytics and Society, with a focus on consumption-based emissions of UK households. In addition to this she has an MSc from King’s College London in Sustainable Cities and a BSc from the University of Glasgow in Psychology with Sociology. Lena is particularly interested in subnational distributions of emissions to assess carbon inequalities as well as spatial differences in footprints. Moreover, from 2022-2025 she contributed to the construction of the UK’s Multi-Regional Input-Output (UKMRIO) model.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/k/kilian-lena-cml.jpeg/kilian-lena-cml.jpeg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/lena-kilian", "field": "industrial_ecology", "classification_basis": "department", "rank": "Assistant professor", "harmonized_tags": ["Input-output analysis & footprints", "Climate, energy & decarbonisation", "Spatial analysis & GIS"], "original_keywords": ["consumption-based emissions", "gis", "input-output analysis"], "raw_keywords": ["consumption-based emissions", "gis", "input-output analysis"], "cml_themes": ["Resources", "Urban"], "cml_scores": {"Resources": 1.0, "Urban": 1.1}}, {"name": "Rene Kleijn", "title": "Professor Industrial Ecology", "keywords": ["circular economy", "critical materials", "industrial ecology", "life cycle assessment", "master industrial ecology", "material flow accounting", "resilent supply chains", "substance flow analysis", "urban studies"], "tags": ["Professor Industrial Ecology", "circular economy", "critical materials", "industrial ecology", "life cycle assessment", "master industrial ecology", "material flow accounting", "resilent supply chains", "substance flow analysis", "urban studies"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "René Kleijn holds an MSc in chemistry and a PhD in Industrial Ecology both from Leiden University. He is now an associate professor at Institute of Environmental Sciences (CML) at Leiden University. René Kleijn serves as a Professor of Resilient Resource Supply at Leiden University in the Netherlands, building on his background in Chemistry (MSc) and Industrial Ecology (PhD). He currently heads the Department of Industrial Ecology at the Institute of Environmental Sciences, working alongside 25 senior staff members, 12 postdocs, and about 70 PhD students. René has contributed to the development of Industrial Ecology and participated as a founding member of the International Society of Industrial Ecology. His work includes involvement in more than 15 EU-funded research projects and contributions to the \"Groeien met Groen Staal\" Growth Fund project, which focuses on sustainability in the Dutch steel sector. He helped establish the Leiden-Delft master's program in Industrial Ecology, which has grown into one of the largest educational programs in the field. His research applies quantitative methods such as Substance and Material Flow Analysis and Life Cycle Assessment across various industries including chemical, energy, mining, and recycling. Through this work, he aims to provide evidence-based insights to industry and policy stakeholders. Current research interests include critical raw materials, supply chain resilience, responsible sourcing, circular economy approaches, and understanding the material requirements of the energy transition", "projects": [{"title": "Groeien met Groen Staal. Towards a sustainable future with green steel", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-groeien-met-groen-staal.-towards-a-sustainable-future-with-green-steel"}, {"title": "GREENE – Single-grain re-engineered Nd-Fe-B permanent magnets", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-greene---single-grain-re-engineered-nd-fe-b-permanent-magnets"}, {"title": "REEsilience", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-reesilience"}, {"title": "Material and Digital Traceability for the Certification of Critical Raw Materials (MaDiTraCe)", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/cml-material-and-digital-traceability-for-the-certification-of-critical-raw-materials-maditrace"}, {"title": "SCRREEN3", "url": "https://www.universiteitleiden.nl/en/research/research-projects/science/scrreen3"}], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/kleijn-rene-cml.jpg/kleijn-rene-cml.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/rene-kleijn", "field": "industrial_ecology", "classification_basis": "department", "rank": "Professor", "harmonized_tags": ["Circular economy & critical materials", "Material & substance flow analysis", "Life cycle assessment"], "original_keywords": ["circular economy", "critical raw materials", "life cycle assessment", "material flow analysis", "resilient supply chains", "substance flow analysis", "urban studies"], "raw_keywords": ["circular economy", "critical materials", "industrial ecology", "life cycle assessment", "master industrial ecology", "material flow accounting", "resilent supply chains", "substance flow analysis", "urban studies"], "cml_themes": ["Resources"], "cml_scores": {"Resources": 4.8, "Urban": 1.0}}, {"name": "Arjan de Koning", "title": "Assistant professor", "keywords": ["environmental chemistry", "life cycle impact assessment (lcia)"], "tags": ["Assistant professor", "environmental chemistry", "life cycle impact assessment (lcia)"], "organisation": ["Science", "Institute of Environmental Sciences (CML)", "Department of Industrial Ecology"], "summary": "Arjan de Koning graduated in 1996 in environmental hygienics from Wageningen Agricultural University. From 1996 to 2000 he worked as a researcher at the Energy Research Centre of the Netherlands (ECN). Topic of his research was the measurement and modelling of the interaction of trace amounts of radiocaesium (137Cs) with soils and sediments. Since 2000 he is employed as a researcher at the Institute of Environmental Sciences at Leiden University, department of Industrial Ecology. His research focuses mainly on environmental chemistry and Life Cycle Impact Assessment.", "projects": [], "photo_url": "https://www.universiteitleiden.nl/binaries/content/gallery/ul2/portraits/science/k/arjan_de_koning_200_250.jpg/arjan_de_koning_200_250.jpg/d200x250", "profile_url": "https://www.universiteitleiden.nl/en/staffmembers/arjan-de-koning", "field
