function placeNodeLabels(reserved) {
  const k = view.k, hh = 13 / k, fl = focusLabels(), placed = reserved.slice();
  const hit = b => placed.some(p => b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1]);
  graph.nodes.filter(n => n.el).sort((a, b) => (fl && fl.has(b.id) ? 1 : 0) - (fl && fl.has(a.id) ? 1 : 0) || b.r - a.r).forEach(n => {
    const t = n.el.t;
    if (!labelShown(n, fl)) { t.style.display = "none"; return; }
    const w = (labelOf(n).length * 5.8 + 4) / k, g = 4 / k, base = 0.35 * 11 / k;
    const cands = [
      { ax: "start", x: n.r + g, y: base, box: [n.x + n.r + g, n.y - hh / 2, n.x + n.r + g + w, n.y + hh / 2] },
      { ax: "end", x: -(n.r + g), y: base, box: [n.x - n.r - g - w, n.y - hh / 2, n.x - n.r - g, n.y + hh / 2] },
      { ax: "middle", x: 0, y: -(n.r + g + 2 / k), box: [n.x - w / 2, n.y - n.r - g - hh, n.x + w / 2, n.y - n.r - g] },
      { ax: "middle", x: 0, y: n.r + g + hh * 0.8, box: [n.x - w / 2, n.y + n.r + g, n.x + w / 2, n.y + n.r + g + hh] },
    ];
    const c = cands.find(c => !hit(c.box));
    if (!c) { t.style.display = "none"; return; }
    placed.push(c.box); t.style.display = "";
    t.setAttribute("text-anchor", c.ax); t.setAttribute("x", c.x.toFixed(1)); t.setAttribute("y", c.y.toFixed(1));
  });
}
function placeAll() {
  let reserved = [];
  if (state.view === "people") reserved = placeLabels(view.k);
  if (state.view === "people") graph.clusters.forEach(c => {
    if (!c.halo) return;
    const h = haloGeom(c);
    c.halo.ell.setAttribute("d", h.d);
    const p = c.halo.pos;
    if (p) {
      const w = labelBox(c, 1) , ox = p.ux > 0.35 ? 0 : p.ux < -0.35 ? -w : -w / 2, oy = p.uy < 0 ? -6 : 14, ic = ICONS[c.name] ? 22 : 0;
      c.halo.lab.style.transform = `translate(${p.px.toFixed(1)}px,${p.py.toFixed(1)}px) scale(var(--inv,1))`;
      const t = c.halo.lab.querySelector("text"), g = c.halo.lab.querySelector(".hl-ic");
      t.setAttribute("x", (ox + ic).toFixed(1)); t.setAttribute("y", oy);
      if (g) g.setAttribute("transform", `translate(${ox.toFixed(1)},${oy - 14}) scale(.7)`);
    }
  });
  graph.nodes.forEach(n => n.el && n.el.g.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`));
  if (state.view === "people") placeNodeLabels(reserved);
  graph.links.forEach(l => {
    if (!l.el || l.virtual) return;
    l.el.setAttribute("x1", l.s.x.toFixed(1)); l.el.setAttribute("y1", l.s.y.toFixed(1));
    l.el.setAttribute("x2", l.t.x.toFixed(1)); l.el.setAttribute("y2", l.t.y.toFixed(1));
  });
}

function renderGraph(list) {
  const narrow = window.matchMedia("(max-width:760px)").matches;
  const wrap = $("graph-wrap"), svg = $("svg");
  const W = narrow ? 560 : Math.max(700, Math.min(1800, Math.round(wrap.clientWidth || 900))), H = narrow ? 860 : Math.max(420, Math.min(900, Math.round(W * (wrap.clientHeight || 560) / (wrap.clientWidth || 900))));
  const shape = narrow + ":" + Math.round(H / 60) + ":" + Math.round(W / 150);   // a clearly different panel shape needs a fresh layout
  const grouping = state.view + ":" + (cmlGrouped() ? [...state.cml].sort().join("|") : state.colorBy);   // a new grouping needs a fresh layout
  if (svg.dataset.narrow !== shape || svg.dataset.grouping !== grouping) { positions.clear(); svg.dataset.narrow = shape; svg.dataset.grouping = grouping; }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  view.W = W; view.H = H;
  graph = buildGraph(list);
  layout(graph, W, H);
  syncDom(); placeAll(); fit();
}

function renderClusters() {
  $("clusterSum").textContent = `Clusters · ${graph.clusters.length} (click one to highlight it on the map)`;
  $("clusters").innerHTML = graph.clusters.map(c => {
    const sel = state.focus && state.focus.kind === "cluster" && state.focus.id === c.id;
    const tot = c.ie + c.eb || 1;
    return `<div class="panel cluster ${sel ? "sel" : ""}" data-c="${c.id}" role="button" tabindex="0" style="border-left-color:${c.color}">
      <b>${cmlGrouped() ? `<span style="color:${c.color}">${icon(c.name, 16)}</span> ` : ""}${esc(c.name)} <small>· ${c.people.length} people${state.view === "people" ? "" : ` · ${c.nodes.length} items`}</small></b>
      <small>${c.nodes.slice(0, state.view === "people" ? 10 : 6).map(n => esc(n.id)).join(", ")}${c.nodes.length > (state.view === "people" ? 10 : 6) ? "…" : ""}</small>
      <div class="splitbar" title="${c.ie} industrial ecology · ${c.eb} environmental biology"><i style="width:${100 * c.ie / tot}%;background:${COLORS.industrial_ecology}"></i><i style="width:${100 * c.eb / tot}%;background:${COLORS.environmental_biology}"></i></div></div>`;
  }).join("") || '<span class="mute">No clusters – lower “min. people per node” or relax the filters.</span>';
}

/* ---------- people ---------- */
function snippet(p) {
  if (!state.terms.length || !p.summary) return "";
  const low = p.summary.toLowerCase(), hit = state.terms.map(t => low.indexOf(t)).filter(i => i >= 0).sort((a, b) => a - b)[0];
  if (hit === undefined) return "";
  const from = Math.max(0, hit - 60), to = Math.min(p.summary.length, hit + 100);
  let txt = esc(p.summary.slice(from, to));
  state.terms.forEach(t => { txt = txt.replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`); });
  return `<div class="snippet">${from ? "…" : ""}${txt}${to < p.summary.length ? "…" : ""}</div>`;
}
function renderCard() {
  const el = $("card"), p = state.card;
  if (!p || !graph.nodes.some(n => n.person === p)) { el.hidden = true; el.innerHTML = ""; return; }
  const n = graph.nodes.find(x => x.person === p);
  const chip = (t, style = "") => `<span class="chip" style="${style}">${esc(t)}</span>`;
  const themes = p.cml_themes.map(c => `<span class="chip" style="color:${cmlColor(c)}">${icon(c, 12)} ${esc(c)}</span>`).join("");
  const groups = cmlGrouped() ? "" : `<h4>${state.colorBy === "method" ? "Method" : "Field"} clusters</h4><div class="row">${(n.memberships || []).map((c, i) => `<span class="chip" style="border-color:${c.color};color:${c.color}">${i ? "" : "● "}${esc(c.name)}</span>`).join("")}</div>`;
  const bio = (p.summary || "").trim(), projects = (p.projects || []).slice(0, 4);
  el.innerHTML = `<div class="chead"><img src="${esc(p.photo_url)}" alt="" onerror="this.style.visibility='hidden'">
    <div><h3><a href="${esc(p.profile_url)}" target="_blank" rel="noopener">${esc(p.name)}</a></h3>
    <div class="sub">${esc(p.rank || p.title || "")}</div><div class="sub">${esc(LABELS[p.field] || "")}</div></div>
    <button class="cx" id="cardClose" aria-label="Close">×</button></div>
    <h4>CML themes</h4><div class="row">${themes}</div>${groups}
    ${p.themes.length ? `<h4>Tags</h4><div class="row">${p.themes.map(t => chip(t)).join("")}</div>` : ""}
    ${p.kws.length ? `<h4>Keywords</h4><div class="row">${p.kws.map(k => chip(k)).join("")}</div>` : ""}
    ${bio ? `<h4>About</h4><p class="bio">${esc(bio.length > 650 ? bio.slice(0, 650).replace(/\s+\S*$/, "") + "…" : bio)}</p>` : ""}
    ${projects.length ? `<h4>Projects</h4><div class="bio">${projects.map(pr => `<div><a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.title)}</a></div>`).join("")}</div>` : ""}`;
  el.hidden = false;
}
function renderPeople(list) {
  const fl = focusLabels();
  let shown = list;
  if (fl) shown = list.filter(p => itemsOf(p).some(i => fl.has(i)));
  shown = [...shown].sort((a, b) => a.name.split(" ").slice(-1)[0].localeCompare(b.name.split(" ").slice(-1)[0]));
  $("peopleCount").textContent = `(${shown.length})`;
  $("focusBar").innerHTML = state.focus
    ? `<div class="focus-bar"><span>Focus: <b>${esc(state.focus.title)}</b></span><button class="link" id="clearFocus" style="margin-left:auto">clear</button></div>` : "";
  $("people").innerHTML = shown.map(p => {
    const themes = p.themes.map(t => `<span role="button" tabindex="0" class="chip theme ${state.tags.has(t) ? "active" : ""} ${fl && fl.has(t) ? "hit" : ""}" data-tag="${esc(t)}" title="Filter by this tag">${esc(t)}</span>`).join("");
    const kws = p.kws.map(k => `<span role="button" tabindex="0" class="chip ${state.kws.has(k) ? "active" : ""} ${fl && fl.has(k) ? "hit" : ""}" data-kw="${esc(k)}" title="Filter by this keyword">${esc(k)}</span>`).join("");
    return `<div class="person ${fl && itemsOf(p).some(i => fl.has(i)) ? "hl" : ""}"><img src="${esc(p.photo_url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div><div class="name"><a href="${esc(p.profile_url)}" target="_blank" rel="noopener">${esc(p.name)}</a>
        <span class="badge" style="background:${COLORS[p.field]}">${p.field === "industrial_ecology" ? "IE" : "EB"}</span>${p.cml_themes.map(c => `<span class="cmlbadge" style="color:${cmlColor(c)}" title="${esc(c)}">${icon(c, 15)}</span>`).join("")}</div>
      <div class="mute">${esc(p.rank)}${p.title && p.title !== p.rank ? " · " + esc(p.title) : ""}</div>
      ${snippet(p)}<div>${themes}</div>${kws || p.summary ? `<details class="bio" ${fl && p.kws.some(k => fl.has(k)) ? "open" : ""}><summary>Keywords &amp; bio</summary>${kws ? `<div>${kws}</div>` : ""}${p.summary ? `<p>${esc(p.summary)}</p>` : ""}</details>` : ""}</div></div>`;
  }).join("") || '<p class="mute">Nobody matches the current filters.</p>';
}

/* ---------- active filters + shareable URL ---------- */
function renderActive() {
  const chips = [];
  if (state.depts.size < Object.keys(LABELS).length) chips.push(["dept:*", "Department: " + [...state.depts].map(d => LABELS[d]).join(", ")]);
  state.cml.forEach(c => chips.push(["cml:" + c, `Theme: ${c}`]));
  state.tags.forEach(c => chips.push(["tag:" + c, `Tag: ${c}`]));
  state.kws.forEach(c => chips.push(["kw:" + c, `Keyword: ${c}`]));
  if (state.terms.length) chips.push(["q:", `Search: “${state.q.trim()}”`]);
  $("activeFilters").innerHTML = chips.map(([k, txt]) => `<span class="chip" role="button" tabindex="0" data-rm="${esc(k)}" title="Remove this filter">${esc(txt)} ×</span>`).join("");
}
function saveHash() {
  const u = new URLSearchParams();
    if (state.q.trim()) u.set("q", state.q.trim());
  if (state.cml.size) u.set("cml", [...state.cml].join("|"));
  if (state.tags.size) u.set("tag", [...state.tags].join("|"));
  if (state.kws.size) u.set("kw", [...state.kws].join("|"));
  if (state.depts.size < Object.keys(LABELS).length) u.set("dept", [...state.depts].join("|"));
  if (state.colorBy !== "cml") u.set("c", state.colorBy);
  if (state.tagMode !== "any") u.set("tm", state.tagMode);
  if (state.kwMode !== "any") u.set("km", state.kwMode);
  if (state.minCount !== 1) u.set("min", state.minCount);
  if (state.resolution !== 2) u.set("res", state.resolution);
  try { history.replaceState(null, "", u.toString() ? "#" + u : location.pathname + location.search); } catch (e) { /* sandboxed preview */ }
}
function loadHash() {
  const u = new URLSearchParams(location.hash.slice(1)), list = k => (u.get(k) || "").split("|").filter(Boolean);
  
  if (u.get("q")) { state.q = u.get("q"); state.terms = state.q.toLowerCase().split(/\s+/).filter(Boolean); $("q").value = state.q; }
  list("cml").forEach(c => state.cml.add(c)); list("tag").forEach(c => state.tags.add(c)); list("kw").forEach(c => state.kws.add(c));
  if (u.get("dept")) state.depts = new Set(list("dept").filter(d => LABELS[d]));
  if (["cml", "field", "method"].includes(u.get("c"))) state.colorBy = u.get("c"); else if (u.get("c") === "cluster") state.colorBy = "field";
  if (u.get("tm")) state.tagMode = u.get("tm");
  if (u.get("km")) state.kwMode = u.get("km");
  if (u.get("min")) { state.minCount = +u.get("min"); $("minCount").value = state.minCount; $("minCountVal").textContent = state.minCount; }
  if (u.get("res")) { state.resolution = +u.get("res"); $("resolution").value = state.resolution; $("resolutionVal").textContent = state.resolution; }
  markSeg("colorBy", "c", state.colorBy); markSeg("tagMode", "m", state.tagMode); markSeg("kwMode", "m", state.kwMode);
}

/* ---------- main render ---------- */
// opts.keepFacets: skip rebuilding the facet lists. opts.styleOnly: graph structure unchanged, only focus/colour/labels changed.
function render(opts = {}) {
  const list = filtered();
  document.body.dataset.view = state.view; document.body.dataset.group = cmlGrouped() ? "cml" : "free";
  renderPills(); renderActive(); saveHash();
  $("stats").textContent = `${list.length} of ${people.length} people`;
  const active = (state.depts.size < Object.keys(LABELS).length ? 1 : 0) + state.tags.size + state.kws.size + (state.terms.length ? 1 : 0) + state.cml.size;
  $("filterFab").textContent = `Filters${active ? " (" + active + " active)" : ""} · ${list.length} people`;
  $("sheetDone").textContent = `Show ${list.length} people`;
  $("tagSel").textContent = state.tags.size ? `(${state.tags.size} selected)` : ""; if (state.tags.size) $("tagBox").open = true;
  $("kwSel").textContent = state.kws.size ? `(${state.kws.size} selected)` : ""; if (state.kws.size) $("kwBox").open = true;
  if (!opts.keepFacets && !opts.styleOnly) {
    renderFacet("tagList", "tag", p => p.harmonized_tags, state.tags, state.tagQ);
    renderFacet("kwList", "kw", p => p.kws, state.kws, state.kwQ);
  }
  if (opts.styleOnly) { syncDom(); placeAll(); } else { renderGraph(list); }
  renderClusters();
  renderPeople(list);
  renderCard();
}

/* ---------- events ---------- */
function toggle(set, v, on) { on ? set.add(v) : set.delete(v); }
function setFocus(f) {
  const same = state.focus && f && state.focus.kind === f.kind && state.focus.title === f.title;
  state.focus = same ? null : f;
  render({ styleOnly: true });
}
function nodeFocus(n) {
  if (!n.person) return { kind: "node", title: n.id, labels: [n.id] };
  const near = graph.links.filter(l => l.s === n || l.t === n).map(l => (l.s === n ? l.t : l.s).id);
  return { kind: "node", title: `${n.id} (+${near.length} related)`, labels: [n.id, ...near] };
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.dept) { toggle(state.depts, t.dataset.dept, t.checked); state.focus = null; render(); }
  else if (t.dataset.tag !== undefined) { toggle(state.tags, t.dataset.tag, t.checked); state.focus = null; render(); }
  else if (t.dataset.kw !== undefined) { toggle(state.kws, t.dataset.kw, t.checked); state.focus = null; render(); }
});
document.addEventListener("click", e => {
  const t = e.target;
  if (!t.closest(".opts")) document.querySelector(".opts").open = false;
  const rm = t.closest("[data-rm]");
  if (rm) {
    const [kind, ...rest] = rm.dataset.rm.split(":"), val = rest.join(":");
    if (kind === "dept") state.depts = new Set(Object.keys(LABELS)); else if (kind === "cml") state.cml.delete(val);
    else if (kind === "tag") state.tags.delete(val); else if (kind === "kw") state.kws.delete(val);
    else if (kind === "q") { state.q = ""; state.terms = []; $("q").value = ""; }
    if (kind === "dept") renderDept();
    state.focus = null; render(); return;
  }
  const pill = t.closest("[data-cml]");
  if (pill) { toggle(state.cml, pill.dataset.cml, !state.cml.has(pill.dataset.cml)); state.focus = null; render(); return; }
  const chip = t.closest(".chip");
  if (chip) {
    if (chip.dataset.tag !== undefined) toggle(state.tags, chip.dataset.tag, !state.tags.has(chip.dataset.tag));
    else toggle(state.kws, chip.dataset.kw, !state.kws.has(chip.dataset.kw));
    state.focus = null; render(); return;
  }
  const cl = t.closest(".cluster");
  if (cl) {
    const c = graph.clusters[+cl.dataset.c];
    setFocus({ kind: "cluster", id: c.id, title: c.name, labels: clusterIds(c) }); return;
  }
  if (t.id === "clearFocus") { state.focus = null; render({ styleOnly: true }); return; }
  if (t.dataset.clear) { (t.dataset.clear === "tag" ? state.tags : state.kws).clear(); state.focus = null; render(); return; }
  if (t.closest("#tagMode") && t.dataset.m) { state.tagMode = t.dataset.m; markSeg("tagMode", "m", state.tagMode); render(); return; }
  if (t.closest("#kwMode") && t.dataset.m) { state.kwMode = t.dataset.m; markSeg("kwMode", "m", state.kwMode); render(); return; }
  if (t.closest("#colorBy") && t.dataset.c) { state.colorBy = t.dataset.c; state.focus = null; markSeg("colorBy", "c", state.colorBy); render({ keepFacets: true }); return; }
});
function markSeg(id, attr, val) { document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle("on", b.dataset[attr] === val)); }
$("tagSearch").addEventListener("input", e => { state.tagQ = e.target.value; renderFacet("tagList", "tag", p => p.harmonized_tags, state.tags, state.tagQ); });
$("kwSearch").addEventListener("input", e => { state.kwQ = e.target.value; renderFacet("kwList", "kw", p => p.kws, state.kws, state.kwQ); });
let qTimer = 0;
$("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    state.q = e.target.value; state.terms = state.q.toLowerCase().split(/\s+/).filter(Boolean); state.focus = null; render();
  }, 150);
});
$("resolution").addEventListener("input", e => { state.resolution = +e.target.value; $("resolutionVal").textContent = state.resolution; state.focus = null; render({ keepFacets: true }); });
$("minCount").addEventListener("input", e => { state.minCount = +e.target.value; $("minCountVal").textContent = state.minCount; state.focus = null; render({ keepFacets: true }); });
$("allLabels").addEventListener("change", e => { state.allLabels = e.target.checked; render({ styleOnly: true }); });
$("reset").addEventListener("click", () => {
  state.depts = new Set(Object.keys(LABELS)); state.tags.clear(); state.kws.clear(); state.cml.clear(); state.focus = null;
  state.tagQ = state.kwQ = state.q = ""; state.terms = []; $("tagSearch").value = $("kwSearch").value = $("q").value = ""; renderDept(); render();
});

function toggleSide(cls, btn) {
  const hidden = document.body.classList.toggle(cls);
  const b = $(btn), left = btn === "edgeFilters";
  b.setAttribute("aria-pressed", String(!hidden));
  b.textContent = left ? (hidden ? "›" : "‹") : (hidden ? "‹" : "›");   // arrow points the way the panel will move
  b.setAttribute("aria-label", (hidden ? "Show " : "Hide ") + (left ? "filter panel" : "people list"));
  requestAnimationFrame(() => render());   // the map refits to its new width
}
$("edgeFilters").addEventListener("click", () => toggleSide("hide-filters", "edgeFilters"));
$("edgePeople").addEventListener("click", () => toggleSide("hide-people", "edgePeople"));
function setSheet(on) { document.body.classList.toggle("show-filters", on); if (on) $("filters").scrollTop = 0; }
$("filterFab").addEventListener("click", () => setSheet(true));
$("sheetDone").addEventListener("click", () => setSheet(false));

/* zoom / pan / drag */
// cluster names on the map: hover previews the group, click pins the highlight (same as the cluster cards)
const clusterIds = c => (c.members || c.nodes).map(n => n.id);
function setHover(c) {
  const set = c ? new Set(clusterIds(c)) : focusLabels();
  els.nodes.forEach((e, id) => { e.g.classList.toggle("dim", !!set && !set.has(id)); });
  graph.links.forEach(l => { if (l.el) l.el.classList.toggle("dim", !!set && !(set.has(l.s.id) && set.has(l.t.id))); });
  graph.clusters.forEach(k => { if (k.halo) k.halo.lab.classList.toggle("hot", k === c); });
}
$("svg").addEventListener("pointerover", e => { const l = e.target.closest(".halo-label"); if (l) setHover(l.__c); });
$("svg").addEventListener("pointerout", e => { if (e.target.closest(".halo-label")) setHover(null); });
$("svg").addEventListener("click", e => {
  const l = e.target.closest(".halo-label"); if (!l) return;
  const c = l.__c; setFocus({ kind: "cluster", id: c.id, title: c.name, labels: clusterIds(c) });
});
$("svg").addEventListener("keydown", e => {
  const l = e.target.closest && e.target.closest(".halo-label");
  if (l && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); l.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
function closeCard() {

}
$("card").addEventListener("click", e => { if (e.target.closest("#cardClose")) closeCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });
// a press anywhere outside the card closes it, except on a person's dot (that opens that person's card instead)
document.addEventListener("pointerdown", e => { if (state.card && !e.target.closest("#card, .node")) closeCard(); });
$("zin").addEventListener("click", () => zoomAt(view.W / 2, view.H / 2, 1.3));
$("zout").addEventListener("click", () => zoomAt(view.W / 2, view.H / 2, 1 / 1.3));
$("zfit").addEventListener("click", fit);
$("svg").addEventListener("wheel", e => {
  if (window.matchMedia("(max-width:760px)").matches) return;
  e.preventDefault(); const p = svgPoint(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

const tip = $("tip");
let drag = null;
$("svg").addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest(".halo-label")) return;   // halo labels are clickable, not pan handles
  const g = e.target.closest(".node"), p = svgPoint(e);
  drag = g ? { node: g.__n, moved: false, sx: e.clientX, sy: e.clientY }
           : { pan: true, p0: p, x0: view.x, y0: view.y };
  $("svg").setPointerCapture(e.pointerId); tip.style.display = "none";
});
$("svg").addEventListener("pointermove", e => {
  if (drag) {
    if (drag.node) {
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true; drag.node.fixed = true;
      const p = svgPoint(e); drag.node.x = (p.x - view.x) / view.k; drag.node.y = (p.y - view.y) / view.k;
      reheat(0.3); placeAll();
    } else {
      const p = svgPoint(e); view.x = drag.x0 + p.x - drag.p0.x; view.y = drag.y0 + p.y - drag.p0.y;
      $("svg").classList.add("panning"); applyView();
    }
    return;
  }
  const g = e.target.closest(".node");
  if (!g) { tip.style.display = "none"; return; }
  const n = g.__n, who = n.people.map(p => p.name);
  if (n.person) {
    const p = n.person;
    tip.innerHTML = `<b>${esc(p.name)}</b><br>${esc(p.rank)} · ${LABELS[p.field]}<br>${p.cml_themes.map(c => `${icon(c, 12)} ${esc(c)}`).join("<br>")}`;
    tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px"; return;
  }
  tip.innerHTML = `<b>${esc(n.id)}</b><br>${who.length} people: ${esc(who.slice(0, 8).join(", "))}${who.length > 8 ? "…" : ""}`;
  tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px";
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null; $("svg").classList.remove("panning");
  if (d.node) { d.node.fixed = false; if (!d.moved) { setFocus(nodeFocus(d.node)); state.card = state.focus && state.focus.kind === "node" ? d.node.person : null; renderCard(); } else positions.set(d.node.id, { x: d.node.x, y: d.node.y }); }
}
$("svg").addEventListener("pointerup", endDrag);
$("svg").addEventListener("pointercancel", endDrag);
$("svg").addEventListener("mouseleave", () => tip.style.display = "none");

$("share").addEventListener("click", () => {
  const done = () => { $("shareTxt").textContent = "Copied!"; setTimeout(() => $("shareTxt").textContent = "Copy link", 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(done, () => { prompt("Copy this link", location.href); });
});
document.addEventListener("keydown", e => {
  const t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button") {
    e.preventDefault();
    if (t.__n) setFocus(nodeFocus(t.__n)); else t.click();
  } else if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") {
    if (state.focus) { state.focus = null; render({ styleOnly: true }); }
    else if (t === $("q") && $("q").value) { $("q").value = ""; $("q").dispatchEvent(new Event("input")); }
  }
});

loadHash(); $("clusterBox").open = state.view !== "people"; renderDept(); render();
</script>
</body>
</html>
